<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Prova programma Messina</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#f2f3f5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: barra in alto con le parti del programma; sotto, una parte alla volta. Gestionali con menu laterale (in riga sul telefono), app dentro la cornice di un telefono. Bianco e nero con vetro leggero. */
:root{
  --bg:#f2f3f5; --halo1:#e0e4eb; --halo2:#e9e9ee;
  --ink:#111214; --muted:#5b5e66; --line:rgba(17,18,20,.09);
  --glass:rgba(255,255,255,.72); --glass-edge:rgba(255,255,255,.95); --glass-strong:rgba(255,255,255,.92);
  --solid:#111214; --on-solid:#ffffff; --soft:rgba(17,18,20,.05);
  --alert:#b42318; --alert-soft:#fdecea; --ok:#146c43; --ok-soft:#e7f5ec;
  --frame:#1b1c20; --screen1:#eceef3; --screen2:#f6f7f9;
  --shadow:0 1px 2px rgba(20,24,32,.04),0 16px 36px -22px rgba(20,24,32,.28);
  --font:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;font-family:var(--font);font-size:15px;line-height:1.45;color:var(--ink);
  background:radial-gradient(900px 520px at 90% -10%,var(--halo1),transparent 65%),radial-gradient(760px 520px at -8% 108%,var(--halo2),transparent 60%),var(--bg);
  background-color:var(--bg);background-attachment:fixed;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font-family:inherit;color:inherit;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:2px solid var(--solid);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}

.glass{background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%);border:1px solid var(--glass-edge);box-shadow:var(--shadow);border-radius:20px}
.card{padding:18px}
.muted{color:var(--muted)}
.lbl{font-size:13px;color:var(--muted);font-weight:500}
.big{font-size:30px;font-weight:800;letter-spacing:-.025em;margin-top:4px;font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:14px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr))}
.pill{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--glass-strong);white-space:nowrap}
.pill.dark{background:var(--solid);color:var(--on-solid);border-color:var(--solid)}
.pill.red{color:var(--alert);border-color:var(--alert);background:var(--alert-soft)}
.pill.ok{color:var(--ok);border-color:var(--ok);background:var(--ok-soft)}
.btn{font-size:15px;font-weight:700;padding:11px 18px;border-radius:999px;border:1px solid var(--solid);background:var(--solid);color:var(--on-solid);cursor:pointer;min-height:44px}
.btn.ghost{background:var(--glass-strong);color:var(--ink);border-color:var(--line)}
.btn.sm{font-size:13px;padding:7px 12px;min-height:36px}
.chipbtn{font-size:14px;font-weight:600;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--glass-strong);cursor:pointer;min-height:40px}
.chipbtn.on{background:var(--solid);color:var(--on-solid);border-color:var(--solid)}
.msg{border-radius:14px;padding:12px 14px;font-weight:600;background:var(--solid);color:var(--on-solid);display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.msg .btn{background:var(--on-solid);color:var(--solid);border-color:var(--on-solid)}
.miss{color:var(--alert);font-weight:700}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--glass-strong);border-radius:999px;padding:0 14px;min-height:42px;max-width:100%}
.search input{border:0;outline:none;background:transparent;font:inherit;font-size:14px;color:var(--ink);width:220px;max-width:100%}
.sr{position:absolute;left:-9999px}

/* barra in alto */
.wrap{max-width:1380px;margin:0 auto;padding-block:14px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin-bottom:18px;padding:10px 12px;display:flex;align-items:center;gap:14px}
.brand{font-weight:800;letter-spacing:-.03em;font-size:19px;white-space:nowrap;padding:0 6px}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;font-size:14px;font-weight:600;padding:9px 14px;border-radius:999px;cursor:pointer;white-space:nowrap;min-height:40px}
.tab.on{background:var(--solid);color:var(--on-solid)}
.hint{display:flex;gap:10px;align-items:flex-start;padding:12px 16px;margin-bottom:16px;border-radius:16px;font-size:14px}
.hint b{white-space:nowrap}

/* intro */
.hero{padding:28px 26px;margin-bottom:16px}
.hero h1{font-size:clamp(28px,4.4vw,44px);font-weight:800;letter-spacing:-.035em;line-height:1.05}
.hero p{max-width:62ch;margin:12px 0 0;font-size:16px;color:var(--muted)}
.part{display:flex;flex-direction:column;gap:8px;text-align:left;cursor:pointer;border:1px solid var(--glass-edge);padding:18px}
.part h3{font-size:18px;font-weight:700;letter-spacing:-.01em}
.part .go{margin-top:auto;font-weight:700;font-size:14px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.step{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:0;background:transparent;padding:10px;border-radius:14px;cursor:pointer}
.step:hover{background:var(--soft)}
.num{flex:none;width:30px;height:30px;border-radius:99px;background:var(--solid);color:var(--on-solid);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}

/* gestionale */
.gest{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.side{flex:0 0 232px;padding:18px 12px;display:flex;flex-direction:column;gap:3px}
.side .co{padding:0 10px 14px}
.side .co b{font-size:20px;letter-spacing:-.03em;font-weight:800;display:block}
.nav{border:0;background:transparent;text-align:left;font-size:15px;font-weight:600;padding:10px 12px;border-radius:12px;cursor:pointer;min-height:42px;white-space:nowrap}
.nav.on{background:var(--solid);color:var(--on-solid)}
.content{flex:1 1 560px;min-width:0;display:flex;flex-direction:column;gap:16px}
.chead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.chead h2{font-size:28px;font-weight:800;letter-spacing:-.03em}
.list{display:flex;flex-direction:column;gap:2px}
.li{border:0;background:transparent;text-align:left;padding:12px;border-radius:14px;cursor:pointer;display:flex;flex-direction:column;gap:3px;width:100%}
.li.on{background:var(--glass-strong);box-shadow:inset 0 0 0 1px var(--line)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kv div{background:var(--soft);border-radius:14px;padding:10px 12px}
.kv .bad{background:var(--alert-soft);box-shadow:inset 0 0 0 1px var(--alert)}
.tbox{overflow-x:auto;border-radius:16px}
table.t{width:100%;border-collapse:collapse;font-size:14px;min-width:640px}
table.t th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:12px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle;font-variant-numeric:tabular-nums}
table.t tr:last-child td{border-bottom:0}
table.t tr.click{cursor:pointer}
table.t.nw td:not(:last-child){white-space:nowrap}
table.t tr.click:hover td{background:var(--soft)}
.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--solid);border-radius:99px}
.banchi{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px}
.banco{height:36px;border-radius:9px;font-size:11px;font-weight:700;border:0;cursor:pointer}
.banco.fin{background:var(--solid);color:var(--on-solid)}
.banco.run{background:var(--muted);color:var(--on-solid)}
.banco.free{background:var(--glass-strong);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.banco.err{background:var(--alert-soft);color:var(--alert);box-shadow:inset 0 0 0 2px var(--alert)}
.sq{width:13px;height:13px;border-radius:4px;display:inline-block}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;margin-left:6px;border-radius:99px;background:var(--alert);color:#fff;font-size:12px;font-weight:700;line-height:1}
.warn{border-radius:14px;padding:12px 14px;font-weight:700;color:var(--alert);background:var(--alert-soft);box-shadow:inset 0 0 0 1px var(--alert)}
.scaf{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.sc{border:0;border-radius:12px;padding:10px 6px;cursor:pointer;font-weight:700;font-size:13px;display:flex;flex-direction:column;gap:6px;align-items:center;background:var(--glass-strong);box-shadow:inset 0 0 0 1px var(--line);color:var(--ink)}
.sc.on{box-shadow:inset 0 0 0 2px var(--ink)}
.sc .lv{display:grid;grid-template-rows:repeat(6,7px);gap:3px;width:100%}
.sc .lv span{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.sc .lv i{display:block;border-radius:2px;background:var(--soft)}
.sc .lv i.f{background:var(--solid)}
.sc .lv i.h{background:var(--ink)}
.sc .lv i.dim{background:var(--muted);opacity:.35}
.zone{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.zone div{border-radius:12px;padding:10px 12px;background:var(--soft);font-size:13px}
.okrow td:last-child{color:var(--ok);font-weight:700}
.korow td{background:var(--alert-soft)}
.korow td:last-child{color:var(--alert);font-weight:700}
.scanbox{border:2px dashed var(--muted);border-radius:18px;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:16px}

textarea{font:inherit;font-size:15px;line-height:1.5;min-height:110px;border-radius:14px;border:1px solid var(--line);background:var(--glass-strong);color:var(--ink);padding:12px;resize:vertical;width:100%}

/* app su telefono */
.appsec{display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap;justify-content:center}
.appinfo{flex:1 1 300px;max-width:440px;padding:22px}
.appinfo h2{font-size:26px;font-weight:800;letter-spacing:-.03em}
.appinfo ol{margin:12px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.phone{flex:none;width:390px;max-width:100%;height:800px;border-radius:48px;padding:10px;background:var(--frame);box-shadow:var(--shadow)}
.screen{height:100%;border-radius:38px;overflow:hidden;position:relative;background:linear-gradient(180deg,var(--screen1),var(--screen2) 55%,var(--screen1))}
.pscr{position:absolute;inset:0;display:flex;flex-direction:column;gap:12px;padding:22px 16px 16px;overflow-y:auto}
.pcard{background:var(--glass);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid var(--glass-edge);border-radius:18px;box-shadow:var(--shadow)}
.bigbtn{width:100%;font-size:18px;font-weight:800;padding:16px;border-radius:18px;border:2px solid var(--solid);background:var(--solid);color:var(--on-solid);cursor:pointer;min-height:56px}
.bigbtn.ghost{background:var(--glass-strong);color:var(--ink)}
.back{align-self:flex-start;border:0;background:var(--glass-strong);border-radius:999px;font-size:14px;font-weight:600;padding:9px 14px;cursor:pointer;min-height:40px}
.ptitle{font-size:26px;font-weight:800;letter-spacing:-.03em}
.stop{border:1px solid var(--glass-edge);background:var(--glass);border-radius:16px;padding:12px;display:flex;gap:12px;align-items:center;text-align:left;cursor:pointer;width:100%;min-height:68px}
.stop .n{flex:none;width:32px;height:32px;border-radius:99px;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-weight:800}
.stop.done{opacity:.5}
.cam{flex:1;min-height:300px;border-radius:22px;background:#1d1e22;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:18px}
.label{width:100%;max-width:270px;background:#e9e8ee;color:#2b2a31;border-radius:14px;padding:16px;outline:3px solid #ffffff;outline-offset:8px}
.camtxt{color:#e6e6ea;font-size:14px;text-align:center;max-width:280px}
.kvp{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px;gap:10px}
.grades{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.gbtn{font-size:24px;font-weight:800;border-radius:16px;border:2px solid var(--solid);padding:14px 0;cursor:pointer;background:var(--glass-strong);color:var(--ink)}
.gbtn.on{background:var(--solid);color:var(--on-solid)}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:10px}
.round{width:52px;height:52px;border-radius:99px;border:2px solid var(--solid);background:var(--glass-strong);font-size:22px;font-weight:800;cursor:pointer}

/* negozio */
.shop{padding:0;overflow:hidden}
.shophead{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:12px 18px;border-bottom:1px solid var(--line)}
.shopbody{padding:22px 18px 30px}
.shoph1{font-size:clamp(34px,6vw,64px);font-weight:900;letter-spacing:-.05em;line-height:1;margin:16px 0 24px}
.prod{border:1px solid var(--glass-edge);background:var(--glass);border-radius:22px;padding:14px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.ph{aspect-ratio:4/3;max-width:100%;border-radius:16px;background:var(--soft);display:flex;align-items:center;justify-content:center}
.pdet{display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start}
.pdet > *{flex:1 1 360px;min-width:0}
.gradebox{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.gopt{border-radius:16px;padding:12px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px;border:2px solid var(--line);background:var(--glass-strong)}
.gopt.on{border-color:var(--solid);background:var(--solid);color:var(--on-solid)}

@media (max-width:760px){
  .side{flex:1 1 100%;flex-direction:row;overflow-x:auto;padding:8px;gap:4px;align-items:center}
  .side .co{display:none}
  .nav{padding:9px 12px}
  .chead h2{font-size:24px}
  .hero{padding:22px 18px}
}
@media (max-width:520px){
  .brand{display:none}
  .phone{width:100%;height:760px;padding:0;border-radius:30px;background:transparent;box-shadow:none}
  .screen{border-radius:28px;box-shadow:inset 0 0 0 1px var(--line)}
  .banchi{grid-template-columns:repeat(6,minmax(0,1fr))}
  .scaf{grid-template-columns:repeat(3,minmax(0,1fr))}
  .hint b{display:none}
}
@media (max-width:760px){
  body{background-attachment:scroll}
  .search input,textarea{font-size:16px}
  .top{padding:8px;gap:8px;border-radius:18px}
  .tab{padding:8px 12px;font-size:14px}
  .hint{font-size:13px;padding:10px 12px}
  .appsec{flex-direction:column;align-items:stretch;gap:14px}
  .appinfo{order:2;max-width:none;padding:16px}
  .appinfo h2{font-size:20px}
  .phone{order:1;align-self:center}
  .chead .row{width:100%}
  .chead .search{flex:1}
  .chead .search input{width:100%}
  .big{font-size:26px}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .card{padding:14px}
  .gradebox{grid-template-columns:repeat(3,minmax(0,1fr))}
  .shopbody{padding:16px 14px 24px}
  .shophead{padding:10px 12px}
}
@media (max-width:520px){
  .phone{height:calc(100svh - 150px);min-height:600px;max-height:860px}
  .pscr{padding:16px 12px 12px}
  .g4{grid-template-columns:1fr 1fr}
  .kv{grid-template-columns:1fr 1fr}
  .gopt{padding:10px}
  .ptitle{font-size:23px}
}
@media (max-width:360px){
  .g4,.kv{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
/* vita del sistema: notifiche, presentazione, punto evidenziato */
#toasts{position:fixed;z-index:60;right:max(16px,env(safe-area-inset-right,0px));top:calc(78px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:8px;width:min(380px,calc(100vw - 32px));pointer-events:none}
.toast{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:16px;font-size:14px;line-height:1.4;animation:tin .35s ease}
.toast .pill{flex:none}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@media (max-width:760px){
  #toasts{top:auto;bottom:calc(14px + env(safe-area-inset-bottom,0px));right:12px;left:12px;width:auto}
}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}
.browser{border-radius:22px;overflow:hidden;padding:0}
.bbar{display:flex;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.bbar .dots{display:flex;gap:6px;flex:none}.bbar .dots i{width:10px;height:10px;border-radius:99px;background:rgba(17,18,20,.16)}
.bbar .url{flex:1;min-width:0;text-align:center;font-size:13px;color:var(--muted);background:var(--soft);border-radius:99px;padding:6px 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sitoframe{display:block;width:100%;height:calc(100vh - 230px);height:calc(100dvh - 230px);min-height:520px;border:0;background:#f2f3f5}
.gruppo-tit{font-size:20px;font-weight:800;letter-spacing:-.02em;margin:6px 2px 12px}
.g-prog{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-siti{grid-template-columns:repeat(4,minmax(0,1fr))}
.sitocard{padding:20px}
.sitocard h3{font-size:20px;letter-spacing:-.02em}
.minibar{display:flex;align-items:center;gap:6px;padding:8px 10px;border-radius:12px;background:var(--soft);margin-bottom:8px}
.minibar i{width:8px;height:8px;border-radius:99px;background:rgba(17,18,20,.18);flex:none}
.minibar span{flex:1;min-width:0;text-align:center;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:1000px){.g-prog{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:1000px){.g-siti{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.g-siti{grid-template-columns:1fr}}
.portbar{display:flex;flex-direction:column;gap:12px;padding:14px 16px;margin-bottom:14px}
@media (max-width:760px){.sitoframe{height:calc(100dvh - 190px);min-height:460px}}
</style>

<div class="wrap">
  <header class="top glass">
    <div class="brand">Messina</div>
    <nav class="tabs" id="tabs" aria-label="Parti del programma"></nav>
  </header>
  <main id="app"></main>
</div>
<div id="toasts" aria-live="polite"></div>

<script>
(function(){
const S = {
  view:'intro',

function evt(chi,testo){
  const id=++S.live.seq; S.live.feed.unshift({id:id,chi:chi,testo:testo,t:ora()}); if(S.live.feed.length>60)S.live.feed.pop();
  S.live.toasts.push({id:id,chi:chi,testo:testo}); paintToasts();
  setTimeout(()=>{S.live.toasts=S.live.toasts.filter(x=>x.id!==id); paintToasts();},5600);
  if(['Magazzino','Autista','Ordini','Inventario'].indexOf(chi)>=0&&S.j7.spento===false&&S.j7.prog.inv===100) S.j7.copie.unshift([ora(),testo]);
}
function paintToasts(){const el=document.getElementById('toasts'); if(!el)return; el.innerHTML=S.live.toasts.slice(-3).map(x=>`<div class="toast glass"><span class="pill dark">${x.chi}</span><span>${x.testo}</span></div>`).join('');}

        ${j.copie.length?j.copie.slice(0,5).map(x=>`<div class="kvp"><span>${x[1]}</span><b style="color:var(--ok)">✓</b></div>`).join(''):'<div class="lbl">Nessun movimento ancora oggi.</div>'}</div>`;

      ${j.spento?msg('J7 spento. I suoi dati restano archiviati in sola lettura.'):`<div class="row">${j.giorni.length<20?b('Simula le sere','j7Auto')+b('Una sera','j7Giorno','','ghost'):''}${fila>=10?b('Spegni J7','j7Spegni'):'<button class="btn" disabled style="opacity:.35;cursor:not-allowed">Spegni J7</button>'}<span class="lbl">Si spegne solo dopo 10 sere di fila in cui tutto torna.</span></div>`}`;
  }
  return `<div class="row">${tabs.map(x=>chip(x[1],'j7Tab',x[0],j.tab===x[0])).join('')}</div>${inner}`;
}

xt>\u003c/g>\u003cg class=\"citta\" style=\"--i:8\">\u003ccircle cx=\"418\" cy=\"226\" r=\"4\"/>\u003ctext x=\"418\" y=\"243\" text-anchor=\"middle\">Bologna\u003c/text>\u003c/g>\u003cg class=\"citta\" style=\"--i:9\">\u003ccircle cx=\"177\" cy=\"237\" r=\"4\"/>\u003ctext x=\"177\" y=\"254\" text-anchor=\"middle\">Genova\u003c/text>\u003c/g>\u003cg class=\"base\">\u003ccircle class=\"r\" cx=\"197\" cy=\"110\" r=\"7\"/>\u003ccircle class=\"c\" cx=\"197\" cy=\"110\" r=\"7\"/>\u003ctext x=\"191\" y=\"144\" text-anchor=\"end\">Lacchiarella\u003c/text>\u003c/g>\u003c/svg>\n  \u003c/figure>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"wrap\">\u003cdiv class=\"azioni glass\">\u003ca href=\"/traccia/\">\u003cb>Traccia una spedizione\u003c/b>\u003cspan>Con il numero della bolla\u003c/span>\u003c/a>\u003ca href=\"/preventivo/\">\u003cb>Chiedi un preventivo\u003c/b>\u003cspan>Risposta dal nostro commerciale\u003c/span>\u003c/a>\u003ca href=\"/ritiro/\">\u003cb>Prenota un ritiro\u003c/b>\u003cspan>Per i clienti già attivi\u003c/span>\u003c/a>\u003ca href=\"#\" data-link=\"portaleUrl\">\u003cb>Area clienti\u003c/b>\u003cspan>Giacenze, spedizioni, fatture\u003c/span>\u003c/a>\u003c/div>\u003c/div>\n\u003csection id=\"servizi\">\u003cdiv class=\"wrap\">\n    \u003cdiv class=\"sh\">\u003ch2>Quattro servizi, un solo interlocutore.\u003c/h2>\u003cp>Dalla bolla alla fattura ogni passaggio è registrato nel nostro gestionale: sapete sempre dove si trova la vostra merce.\u003c/p>\u003c/div>\n    \u003cdiv class=\"servizi glass\">\n  \u003cdiv class=\"srv\">\n    \u003ch3>\u003ca href=\"/servizi/trasporto/\">Distribuzione e trasporto\u003c/a>\u003c/h3>\n    \u003cdiv>\u003cp>Consegne in giornata o su appuntamento in tutto il Nord Italia, con sponda idraulica, consegna al piano e fascia oraria quando serve.\u003c/p>\u003cul>\u003cli>Collettame e carichi completi\u003c/li>\u003cli>Firma, foto e posizione a ogni consegna\u003c/li>\u003c/ul>\u003cp class=\"vai\">\u003ca href=\"/servizi/trasporto/\">Scopri il servizio\u003c/a>\u003c/p>\u003c/div>\n    \u003cspan class=\"tag\">Bancali e colli\u003c/span>\n  \u003c/div>\n  \u003cdiv class=\"srv\">\n    \u003ch3>\u003ca href=\"/servizi/magazzino/\">Magazzino e logistica\u003c/a>\u003c/h3>\n    \u003cdiv>\u003cp>Custodiamo la vostra merce a Lacchiarella: ogni bancale ha un codice e un posto, controllato con lo scanner a ogni movimento.\u003c/p>\u003cul>\u003cli>Giacenze visibili dal vivo\u003c/li>\u003cli>Preparazione ordini e merce di passaggio in giornata\u003c/li>\u003c/ul>\u003cp class=\"vai\">\u003ca href=\"/servizi/magazzino/\">Scopri il servizio\u003c/a>\u003c/p>\u003c/div>\n    \u003cspan class=\"tag\">Area clienti\u003c/span>\n  \u003c/div>\n  \u003cdiv class=\"srv\">\n    \u003ch3>\u003ca href=\"/servizi/logistica-it/\">Logistica IT\u003c/a>\u003c/h3>\n    \u003cdiv>\u003cp>PC e telefoni aziendali preparati per ogni dipendente, consegnati in sede e ritirati a fine vita, tutto tracciato per numero di serie.\u003c/p>\u003cul>\u003cli>Etichette cespite e accessori per utente\u003c/li>\u003cli>Busta di reso per il dispositivo vecchio\u003c/li>\u003c/ul>\u003cp class=\"vai\">\u003ca href=\"/servizi/logistica-it/\">Scopri il servizio\u003c/a>\u003c/p>\u003c/div>\n    \u003cspan class=\"tag\">Seriali e IMEI\u003c/span>\n  \u003c/div>\n  \u003cdiv class=\"srv\">\n    \u003ch3>\u003ca href=\"/servizi/giacenze-resi/\">Giacenze e resi\u003c/a>\u003c/h3>\n    \u003cdiv>\u003cp>Se il destinatario non c'è, la merce torna al sicuro in magazzino e vi avvisiamo il giorno stesso. Decidete voi come procedere.\u003c/p>\u003cul>\u003cli>Riconsegna, reso o ritiro in sede\u003c/li>\u003cli>Resi dai vostri clienti gestiti per voi\u003c/li>\u003c/ul>\u003cp class=\"vai\">\u003ca href=\"/servizi/giacenze-resi/\">Scopri il servizio\u003c/a>\u003c/p>\u003c/div>\n    \u003cspan class=\"tag\">Avviso in giornata\u003c/span>\n  \u003c/div>\u003c/div>\n  \u003c/div>\u003c/section>\n\u003csection style=\"padding-top:0\">\u003cdiv class=\"wrap\">\n    \u003cdiv class=\"sh\">\u003ch2>Come lavoriamo.\u003c/h2>\u003cp>Sei passaggi, sempre gli stessi. Ognuno lascia una traccia che potete chiederci in qualsiasi momento.\u003c/p>\u003c/div>\n    \u003col class=\"passi glass\">\u003cli>\u003cb>Ordine\u003c/b>\u003cspan>Ci scrivete per mail, come fate oggi.\u003c/span>\u003c/li>\u003cli>\u003cb>Bolla verificata\u003c/b>\u003cspan>Controlliamo che ci sia tutto prima di partire.\u003c/span>\u003c/li>\u003cli>\u003cb>Magazzino\u003c/b>\u003cspan>Ogni collo passa dallo scanner.\u003c/span>\u003c/li>\u003cli>\u003cb>Giro\u003c/b>\u003cspan>Percorso e mezzo scelti per il carico.\u003c/span>\u003c/li>\u003cli>\u003cb>Consegna\u003c/b>\u003cspan>Firma, foto e posizione del destinatario.\u003c/span>\u003c/li>\u003cli>\u003cb>Fattura\u003c/b>\u003cspan>Elettronica, con il dettaglio delle consegne.\u003c/span>\u003c/li>\u003c/ol>\n  \u003c/div>\u003c/section>\n\u003csection style=\"padding-top:0\">\u003cdiv class=\"wrap\">\n    \u003cdiv class=\"sh\">\u003ch2>Lavoriamo per chi non può sbagliare una consegna.\u003c/h2>\u003cp>Aziende tecnologiche, energia, banche, beverage e cosmetica: settori dove la puntualità e la tracciabilità contano quanto il trasporto.\u003c/p>\u003c/div>\n    \u003cdiv class=\"settori-strip\">\u003ca href=\"/settori/\">Tecnologia ed elettronica\u003c/a>\u003ca href=\"/settori/\">Energia e impianti\u003c/a>\u003ca href=\"/settori/\">Banche e assicurazioni\u003c/a>\u003ca href=\"/settori/\">Beverage\u003c/a>\u003ca href=\"/settori/\">Cosmetica e retail\u003c/a>\u003ca href=\"/settori/\">E-commerce\u003c/a>\u003c/div>\n  \u003c/div>\u003c/section>\n\u003csection id=\"flotta\" style=\"padding-top:0\">\u003cdiv class=\"wrap\">\n    \u003cdiv class=\"sh\">\u003ch2>Il mezzo giusto per il carico.\u003c/h2>\u003cp>Circa 30 mezzi, quasi tutti con sponda idraulica, guidati dai nostri autisti. Disegnati qui in scala, uno accanto all'altro.\u003c/p>\u003c/div>\n    \u003cdiv class=\"strada\" role=\"list\">\n  \u003cdiv class=\"mezzo m1\" role=\"listitem\">\u003csvg viewBox=\"0 0 200 104\" aria-hidden=\"true\">\u003cpath class=\"t\" d=\"M6 92 V40 Q6 28 18 26 L118 22 Q132 22 140 32 L176 58 Q194 62 194 76 V92 Z\"/>\u003cpath class=\"v\" d=\"M124 34 L166 60 H124 Z\" opacity=\".85\"/>\u003ccircle class=\"ruota\" cx=\"44\" cy=\"92\" r=\"12\"/>\u003ccircle class=\"cerchio\" cx=\"44\" cy=\"92\" r=\"4.32\"/>\u003ccircle class=\"ruota\" cx=\"158\" cy=\"92\" r=\"12\"/>\u003ccircle class=\"cerchio\" cx=\"158\" cy=\"92\" r=\"4.32\"/>\u003c/svg>\u003cdiv class=\"solo-tel\">\u003ch3>Furgoni e Sprinter\u003c/h3>\u003cp>Città, consegne veloci, ZTL.\u003c/p>\u003c/div>\u003c/div>\n  \u003cdiv class=\"mezzo m2\" role=\"listitem\">\u003csvg viewBox=\"0 0 320 150\" aria-hidden=\"true\">\u003crect class=\"t\" x=\"6\" y=\"10\" width=\"214\" height=\"118\" rx=\"6\"/>\u003cpath class=\"t\" d=\"M226 128 V58 Q226 46 238 46 H280 Q292 46 298 58 L314 94 V128 Z\"/>\u003cpath class=\"v\" d=\"M240 58 H278 L292 88 H240 Z\" opacity=\".85\"/>\u003crect class=\"v\" x=\"6\" y=\"128\" width=\"214\" height=\"5\"/>\u003ccircle class=\"ruota\" cx=\"48\" cy=\"134\" r=\"14\"/>\u003ccircle class=\"cerchio\" cx=\"48\" cy=\"134\" r=\"5.04\"/>\u003ccircle class=\"ruota\" cx=\"84\" cy=\"134\" r=\"14\"/>\u003ccircle class=\"cerchio\" cx=\"84\" cy=\"134\" r=\"5.04\"/>\u003ccircle class=\"ruota\" cx=\"276\" cy=\"134\" r=\"14\"/>\u003ccircle class=\"cerchio\" cx=\"276\" cy=\"134\" r=\"5.04\"/>\u003c/svg>\u003cdiv class=\"solo-tel\">\u003ch3>Motrici e tre assi\u003c/h3>\u003cp>Con sponda, per bancali e consegne al piano.\u003c/p>\u003c/div>\u003c/div>\n  \u003cdiv class=\"mezzo m3\" role=\"listitem\">\u003csvg viewBox=\"0 0 480 160\" aria-hidden=\"true\">\u003crect class=\"t\" x=\"6\" y=\"8\" width=\"372\" height=\"124\" rx=\"6\"/>\u003crect class=\"v\" x=\"6\" y=\"132\" width=\"372\" height=\"5\"/>\u003cpath class=\"t\" d=\"M386 140 V64 Q386 52 398 52 H440 Q452 52 458 64 L474 100 V140 Z\"/>\u003cpath class=\"v\" d=\"M400 64 H438 L452 94 H400 Z\" opacity=\".85\"/>\u003ccircle class=\"ruota\" cx=\"250\" cy=\"144\" r=\"14\"/>\u003ccircle class=\"cerchio\" cx=\"250\" cy=\"144\" r=\"5.04\"/>\u003ccircle class=\"ruota\" cx=\"284\" cy=\"144\" r=\"14\"/>\u003ccircle class=\"cerchio\" cx=\"284\" cy=\"144\" r=\"5.04\"/>\u003ccircle class=\"ruota\" cx=\"318\" cy=\"144\" r=\"14\"/>\u003ccircle class=\"cerchio\" cx=\"318\" cy=\"144\" r=\"5.04\"/>\u003ccircle class=\"ruota\" cx=\"410\" cy=\"144\" r=\"14\"/>\u003ccircle class=\"cerchio\" cx=\"410\" cy=\"144\" r=\"5.04\"/>\u003ccircle class=\"ruota\" cx=\"446\" cy=\"144\" r=\"14\"/>\u003ccircle class=\"cerchio\" cx=\"446\" cy=\"144\" r=\"5.04\"/>\u003c/svg>\u003cdiv class=\"solo-tel\">\u003ch3>Bilici\u003c/h3>\u003cp>Carichi completi e tratte lunghe.\u003c/p>\u003c/div>\u003c/div>\n\u003c/div>\n\u003cdiv class=\"mezzi-testo\">\n  \u003cdiv>\u003ch3>Furgoni e Sprinter\u003c/h3>\u003cp>Città, consegne veloci, ZTL.\u003c/p>\u003c/div>\n  \u003cdiv>\u003ch3>Motrici e tre assi\u003c/h3>\u003cp>Con sponda, per bancali e consegne al piano.\u003c/p>\u003c/div>\n  \u003cdiv>\u003ch3>Bilici\u003c/h3>\u003cp>Carichi completi e tratte lunghe.\u003c/p>\u003c/div>\n\u003c/div>\u003cp class=\"vai\" style=\"margin-top:22px\">\u003ca href=\"/flotta/\">Tutta la flotta\u003c/a>\u003c/p>\n  \u003c/div>\u003c/section>\n\u003csection style=\"padding-top:0\">\u003cdiv class=\"wrap mag\">\n  \u003cdiv>\n    \u003ch2 class=\"h2\">La vostra merce, sempre sotto gli occhi.\u003c/h2>\n    \u003cp class=\"muted\" style=\"margin-top:16px;max-width:46ch\">Il magazzino di Lacchiarella è organizzato in corsie e scaffali a 6 piani. Ogni bancale ha un codice, un posto e una storia: chi l'ha messo lì, quando, e quando è uscito.\u003c/p>\n    \u003cul class=\"punti\">\u003cli>Area clienti con giacenze aggiornate dal vivo\u003c/li>\u003cli>Controllo con lo scanner a ogni ingresso e uscita\u003c/li>\u003cli>Riconsegna chiesta online, con la data che preferite\u003c/li>\u003c/ul>\n    \u003cp style=\"margin-top:26px\">\u003ca class=\"btn ghost\" href=\"/servizi/magazzino/\">Il magazzino\u003c/a>\u003c/p>\n  \u003c/div>\n  \u003cdiv class=\"portale-mini glass\" aria-label=\"Esempio dell'area clienti\">\n  \u003cdiv class=\"testa\">\u003cb>I vostri bancali\u003c/b>\u003cspan>Area clienti\u003c/span>\u003c/div>\n  \u003ctable>\u003cthead>\u003ctr>\u003cth>Codice\u003c/th>\u003cth>Posto\u003c/th>\u003cth>Dal\u003c/th>\u003cth>Stato\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n    \u003ctr>\u003ctd>B-1042\u003c/td>\u003ctd>S03-2-4\u003c/td>\u003ctd>2 ott\u003c/td>\u003ctd>\u003cspan class=\"stato\">In magazzino\u003c/span>\u003c/td>\u003c/tr>\n    \u003ctr>\u003ctd>B-1043\u003c/td>\u003ctd>S03-2-5\u003c/td>\u003ctd>2 ott\u003c/td>\u003ctd>\u003cspan class=\"stato\">In magazzino\u003c/span>\u003c/td>\u003c/tr>\n    \u003ctr>\u003ctd>B-1077\u003c/td>\u003ctd>S05-1-1\u003c/td>\u003ctd>9 ott\u003c/td>\u003ctd>\u003cspan class=\"stato esce\">In uscita\u003c/span>\u003c/td>\u003c/tr>\n    \u003ctr>\u003ctd>B-1081\u003c/td>\u003ctd>S01-4-2\u003c/td>\u003ctd>14 ott\u003c/td>\u003ctd>\u003cspan class=\"stato\">In magazzino\u003c/span>\u003c/td>\u003c/tr>\n  \u003c/tbody>\u003c/table>\n  \u003cdiv class=\"piede\">\u003cspan>Richiedi riconsegna\u003c/span>\u003c/div>\n\u003c/div>\n\u003c/div>\u003c/section>\n\u003csection style=\"padding-top:0\">\u003cdiv class=\"wrap\">\u003cdiv class=\"banda\">\n  \u003cdiv>\u003ch2>Cerchiamo autisti e magazzinieri.\u003c/h2>\u003cp>Patente C o CE, carta di qualificazione del conducente, voglia di lavorare in una squadra che usa strumenti nuovi. Mezzi in ordine e assegnati alla persona.\u003c/p>\u003c/div>\n  \u003ca class=\"btn\" href=\"/lavora-con-noi/\">Lavora con noi\u003c/a>\n\u003c/div>\u003c/div>\u003c/section>\u003c/main>\n\u003cmain data-path=\"/servizi/\" data-titolo=\"Servizi | Messina Autotrasporti\" hidden>\u003cdiv class=\"ph\">\u003cdiv class=\"wrap\">\n    \u003cnav class=\"briciole\" aria-label=\"Sei qui\">\u003ca href=\"/\">Home\u003c/a> \u003cspan aria-hidden=\"true\">/\u003c/span> \u003cspan>Servizi\u003c/span>\u003c/nav>\n    \u003ch1>Servizi\u003c/h1>\n    \u003cp class=\"lead\">Un solo fornitore per trasportare, custodire e consegnare. Ogni servizio si può usare da solo o insieme agli altri.\u003c/p>\n  \u003c/div>\u003c/div>\u003csection>\u003cdiv class=\"wrap\">\n    \n    \u003cdiv class=\"servizi glass\">\n  \u003cdiv class=\"srv\">\n    \u003ch3>\u003ca href=\"/servizi/trasporto/\">Distribuzione e trasporto\u003c/a>\u003c/h3>\n    \u003cdiv>\u003cp>Consegne in giornata o su appuntamento in tutto il Nord Italia, con sponda idraulica, consegna al piano e fascia oraria quando serve.\u003c/p>\u003cul>\u003cli>Collettame e carichi completi\u003c/li>\u003cli>Firma, foto e posizione a ogni consegna\u003c/li>\u003c/ul>\u003cp class=\"vai\">\u003ca href=\"/servizi/trasporto/\">Apri distribuzione e trasporto\u003c/a>\u003c/p>\u003c/div>\n    \u003cspan class=\"tag\">Bancali e colli\u003c/span>\n  \u003c/div>\n  \u003cdiv class=\"srv\">\n    \u003ch3>\u003ca href=\"/servizi/magazzino/\">Magazzino e logistica\u003c/a>\u003c/h3>\n    \u003cdiv>\u003cp>Custodiamo la vostra merce a Lacchiarella: ogni bancale ha un codice e un posto, controllato con lo scanner a ogni movimento.\u003c/p>\u003cul>\u003cli>Giacenze visibili dal vivo\u003c/li>\u003cli>Preparazione ordini e merce di passaggio in giornata\u003c/li>\u003c/ul>\u003cp class=\"vai\">\u003ca href=\"/servizi/magazzino/\">Apri magazzino e logistica\u003c/a>\u003c/p>\u003c/div>\n    \u003cspan class=\"tag\">Area clienti\u003c/span>\n  \u003c/div>\n  \u003cdiv class=\"srv\">\n    \u003ch3>\u003ca href=\"/servizi/logistica-it/\">Logistica IT\u003c/a>\u003c/h3>\n    \u003cdiv>\u003cp>PC e telefoni aziendali preparati per ogni dipendente, consegnati in sede e ritirati a fine vita, tutto tracciato per numero di serie.\u003c/p>\u003cul>\u003cli>Etichette cespite e accessori per utente\u003c/li>\u003cli>Busta di reso per il dispositivo vecchio\u003c/li>\u003c/ul>\u003cp class=\"vai\">\u003ca href=\"/servizi/logistica-it/\">Apri logistica it\u003c/a>\u003c/p>\u003c/div>\n    \u003cspan class=\"tag\">Seriali e IMEI\u003c/span>\n  \u003c/div>\n  \u003cdiv class=\"srv\">\n    \u003ch3>\u003ca href=\"/servizi/giacenze-resi/\">Giacenze e resi\u003c/a>\u003c/h3>\n    \u003cdiv>\u003cp>Se il destinatario non c'è, la merce torna al sicuro in magazzino e vi avvisiamo il giorno stesso. Decidete voi come procedere.\u003c/p>\u003cul>\u003cli>Riconsegna, reso o ritiro in sede\u003c/li>\u003cli>Resi dai vostri clienti gestiti per voi\u003c/li>\u003c/ul>\u003cp class=\"vai\">\u003ca href=\"/servizi/giacenze-resi/\">Apri giacenze e resi\u003c/a>\u003c/p>\u003c/div>\n    \u003cspan class=\"tag\">Avviso in giornata\u003c/span>\n  \u003c/div>\u003c/div>\n  \u003c/div>\u003c/section>\u003csection style=\"padding-top:0\">\u003cdiv class=\"wrap\">\n    \u003cdiv class=\"sh\">\u003ch2>Servizi accessori.\u003c/h2>\u003cp>Li indicate nell'ordine e li trovate voce per voce in fattura: niente sorprese, niente dimenticanze.\u003c/p>\u003c/div>\n    \u003cdiv class=\"tabella glass\">\u003ctable>\n    \u003cthead>\u003ctr>\u003cth>Servizio\u003c/th>\u003cth>Quando serve\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n    \u003ctr>\u003ctd>Sponda idraulica\u003c/td>\u003ctd>Scarico di bancali senza banchina\u003c/td>\u003c/tr>\n    \u003ctr>\u003ctd>Consegna al piano\u003c/td>\u003ctd>Uffici, negozi, abitazioni senza accesso a livello strada\u003c/td>\u003c/tr>\n    \u003ctr>\u003ctd>Fascia oraria o appuntamento\u003c/td>\u003ctd>Destinatari con orari di ricevimento\u003c/td>\u003c/tr>\n    \u003ctr>\u003ctd>Prenotazione della consegna\u003c/td>\u003ctd>Grande distribuzione, cantieri, magazzini con prenotazione\u003c/td>\u003c/tr>\n    \u003ctr>\u003ctd>Consegna di sabato\u003c/td>\u003ctd>Su richiesta, il sabato mattina\u003c/td>\u003c/tr>\n    \u003ctr>\u003ctd>Consegne in ZTL\u003c/td>\u003ctd>Centri storici con accesso limitato\u003c/td>\u003c/tr>\n    \u003ctr>\u003ctd>Assicurazione della merce\u003c/td>\u003ctd>Valore superiore al limite di legge\u003c/td>\u003c/tr>\n    \u003ctr>\u003ctd>Contrassegno\u003c/td>\u003ctd>Incasso alla consegna per vostro conto\u003c/td>\u003c/tr>\n    \u003ctr>\u003ctd>Prova di consegna\u003c/td>\u003ctd>Firma, foto della bolla e posizione, sempre disponibili\u003c/td>\u003c/tr>\n    \u003c/tbody>\u003c/table>\u003c/div>\n  \u003c/div>\u003c/section>\u003c/main>\n\u003cmain data-path=\"/servizi/trasporto/\" data-titolo=\"Distribuzione e trasporto | Messina Autotrasporti\" hidden>\u003cdiv class=\"ph\">\u003cdiv class=\"wrap\">\n    \u003cnav class=\"briciole\" aria-label=\"Sei qui\">\u003ca href=\"/\">Home\u003c/a> \u003cspan aria-hidden=\"true\">/\u003c/span> \u003ca href=\"/servizi/\">Servizi\u003c/a> \u003cspan aria-hidden=\"true\">/\u003c/span> \u003cspan>Distribuzione\u003c/span>\u003c/nav>\n    \u003ch1>Distribuzione e trasporto\u003c/h1>\n    \u003cp class=\"lead\">Dal singolo collo al bilico completo, con i nostri mezzi e i nostri autisti: non affidiamo le vostre consegne ad altri vettori.\u003c/p>\n  \u003c/div>\u003c/div>\u003csection>\u003cdiv class=\"wrap\">\n    \u003cdiv class=\"sh\">\u003ch2>Cosa trasportiamo.\u003c/h2>\u003cp>Merce su bancale e a colli, per aziende, negozi, cantieri e consegne a privati per conto dei nostri clienti.\u003c/p>\u003c/div>\n    \u003cdiv class=\"servizi glass\">\n  \u003cdiv class=\"srv\">\n    \u003ch3>Collettame\u003c/h3>\n    \u003cdiv>\u003cp>Spedizioni piccole e medie raggruppate nei giri del giorno. Ritiro da voi o consegna diretta a Lacchiarella.\u003c/p>\u003c/div>\n    \u003cspan class=\"tag\">Da 1 collo\u003c/span>\n  \u003c/div>\n  \u003cdiv class=\"srv\">\n    \u003ch3>Carichi completi\u003c/h3>\n    \u003cdiv>\u003cp>Un mezzo dedicato da un punto all'altro, dalla motrice al bilico. Partenza al mattino, consegna in giornata nel Nord.\u003c/p>\u003c/div>\n    \u003cspan class=\"tag\">Fino a 33 bancali\u003c/span>\n  \u003c/div>\n  \u003cdiv class=\"srv\">\n    \u003ch3>Consegne dedicate\u003c/h3>\n    \u003cdiv>\u003cp>Un mezzo e un autista per voi, per lanci di prodotto, allestimenti, urgenze o consegne che richiedono attenzione particolare.\u003c/p>\u003c/div>\n    \u003cspan class=\"tag\">Su richiesta\u003c/span>\n  \u003c/div>\n  \u003cdiv class=\"srv\">\n    \u003ch3>Consegne a domicilio\u003c/h3>\n    \u003cdiv>\u003cp>Consegniamo ai vostri clienti finali con appuntamento, consegna al piano e avviso prima dell'arrivo.\u003c/p>\u003c/div>\n    \u003cspan class=\"tag\">Per conto vostro\u003c/span>\n  \u003c/div>\u003c/div>\n  \u003c/div>\u003c/section>\u003csection style=\"padding-top:0\">\u003cdiv class=\"wrap\">\n    \u003cdiv class=\"sh\">\u003ch2>Come arriva la vostra spedizione.\u003c/h2>\u003cp>Ogni passaggio è registrato dallo scanner o dall'app dell'autista.\u003c/p>\u003c/div>\n    \u003col class=\"passi glass\">\u003cli>\u003cb>Ritiro o ingresso\u003c/b>\u003cspan>Ritiriamo da voi o ricevete a Lacchiarella.\u003c/span>\u003c/li>\u003cli>\u003cb>Scansione\u003c/b>\u003cspan>Ogni collo è letto prima di salire sul mezzo.\u003c/span>\u003c/li>\u003cli>\u003cb>Giro ottimizzato\u003c/b>\u003cspan>Percorsi calcolati per camion, non per auto.\u003c/span>\u003c/li>\u003cli>\u003cb>Avviso\u003c/b>\u003cspan>Il destinatario sa quando arriviamo.\u003c/span>\u003c/li>\u003cli>\u003cb>Prova di consegna\u003c/b>\u003cspan>Firma, foto della bolla e posizione GPS.\u003c/span>\u003c/li>\u003c/ol>\n  \u003c/div>\u003c/section>\u003csection style=\"padding-top:0\">\u003cdiv class=\"wrap\">\n    \u003cdiv class=\"sh\">\u003ch2>Dove arriviamo.\u003c/h2>\u003cp>Partiamo ogni mattina da Lacchiarella, a sud di Milano. Copriamo con mezzi propri Lombardia, Piemonte, Liguria, Emilia-Romagna e Veneto; per le altre destinazioni chiedeteci un preventivo.\u003c/p>\u003c/div>\n    \u003cdiv class=\"mappa glass solo\">\u003csvg viewBox=\"0 30 560 232\" role=\"img\" ari
