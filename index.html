<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Prova programma Messina</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#f2f3f5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: barra in alto con le parti del programma; sotto, una parte alla volta. Gestionali con menu laterale (in riga sul telefono), app dentro la cornice di un telefono. Bianco e nero con vetro leggero. */
:root{
  --bg:#f2f3f5; --halo1:#e0e4eb; --halo2:#e9e9ee;
  --ink:#111214; --muted:#5b5e66; --line:rgba(17,18,20,.09);
  --glass:rgba(255,255,255,.72); --glass-edge:rgba(255,255,255,.95); --glass-strong:rgba(255,255,255,.92);
  --solid:#111214; --on-solid:#ffffff; --soft:rgba(17,18,20,.05);
  --alert:#b42318; --alert-soft:#fdecea; --ok:#146c43; --ok-soft:#e7f5ec;
  --frame:#1b1c20; --screen1:#eceef3; --screen2:#f6f7f9;
  --shadow:0 1px 2px rgba(20,24,32,.04),0 16px 36px -22px rgba(20,24,32,.28);
  --font:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;font-family:var(--font);font-size:15px;line-height:1.45;color:var(--ink);
  background:radial-gradient(900px 520px at 90% -10%,var(--halo1),transparent 65%),radial-gradient(760px 520px at -8% 108%,var(--halo2),transparent 60%),var(--bg);
  background-color:var(--bg);background-attachment:fixed;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font-family:inherit;color:inherit;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:2px solid var(--solid);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}

.glass{background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%);border:1px solid var(--glass-edge);box-shadow:var(--shadow);border-radius:20px}
.card{padding:18px}
.muted{color:var(--muted)}
.lbl{font-size:13px;color:var(--muted);font-weight:500}
.big{font-size:30px;font-weight:800;letter-spacing:-.025em;margin-top:4px;font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:14px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr))}
.pill{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--glass-strong);white-space:nowrap}
.pill.dark{background:var(--solid);color:var(--on-solid);border-color:var(--solid)}
.pill.red{color:var(--alert);border-color:var(--alert);background:var(--alert-soft)}
.pill.ok{color:var(--ok);border-color:var(--ok);background:var(--ok-soft)}
.btn{font-size:15px;font-weight:700;padding:11px 18px;border-radius:999px;border:1px solid var(--solid);background:var(--solid);color:var(--on-solid);cursor:pointer;min-height:44px}
.btn.ghost{background:var(--glass-strong);color:var(--ink);border-color:var(--line)}
.btn.sm{font-size:13px;padding:7px 12px;min-height:36px}
.chipbtn{font-size:14px;font-weight:600;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--glass-strong);cursor:pointer;min-height:40px}
.chipbtn.on{background:var(--solid);color:var(--on-solid);border-color:var(--solid)}
.msg{border-radius:14px;padding:12px 14px;font-weight:600;background:var(--solid);color:var(--on-solid);display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.msg .btn{background:var(--on-solid);color:var(--solid);border-color:var(--on-solid)}
.miss{color:var(--alert);font-weight:700}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--glass-strong);border-radius:999px;padding:0 14px;min-height:42px;max-width:100%}
.search input{border:0;outline:none;background:transparent;font:inherit;font-size:14px;color:var(--ink);width:220px;max-width:100%}
.sr{position:absolute;left:-9999px}

/* barra in alto */
.wrap{max-width:1380px;margin:0 auto;padding-block:14px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin-bottom:18px;padding:10px 12px;display:flex;align-items:center;gap:14px}
.brand{font-weight:800;letter-spacing:-.03em;font-size:19px;white-space:nowrap;padding:0 6px}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;font-size:14px;font-weight:600;padding:9px 14px;border-radius:999px;cursor:pointer;white-space:nowrap;min-height:40px}
.tab.on{background:var(--solid);color:var(--on-solid)}
.hint{display:flex;gap:10px;align-items:flex-start;padding:12px 16px;margin-bottom:16px;border-radius:16px;font-size:14px}
.hint b{white-space:nowrap}

/* intro */
.hero{padding:28px 26px;margin-bottom:16px}
.hero h1{font-size:clamp(28px,4.4vw,44px);font-weight:800;letter-spacing:-.035em;line-height:1.05}
.hero p{max-width:62ch;margin:12px 0 0;font-size:16px;color:var(--muted)}
.part{display:flex;flex-direction:column;gap:8px;text-align:left;cursor:pointer;border:1px solid var(--glass-edge);padding:18px}
.part h3{font-size:18px;font-weight:700;letter-spacing:-.01em}
.part .go{margin-top:auto;font-weight:700;font-size:14px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.step{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:0;background:transparent;padding:10px;border-radius:14px;cursor:pointer}
.step:hover{background:var(--soft)}
.num{flex:none;width:30px;height:30px;border-radius:99px;background:var(--solid);color:var(--on-solid);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}

/* gestionale */
.gest{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.side{flex:0 0 232px;padding:18px 12px;display:flex;flex-direction:column;gap:3px}
.side .co{padding:0 10px 14px}
.side .co b{font-size:20px;letter-spacing:-.03em;font-weight:800;display:block}
.nav{border:0;background:transparent;text-align:left;font-size:15px;font-weight:600;padding:10px 12px;border-radius:12px;cursor:pointer;min-height:42px;white-space:nowrap}
.nav.on{background:var(--solid);color:var(--on-solid)}
.content{flex:1 1 560px;min-width:0;display:flex;flex-direction:column;gap:16px}
.chead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.chead h2{font-size:28px;font-weight:800;letter-spacing:-.03em}
.list{display:flex;flex-direction:column;gap:2px}
.li{border:0;background:transparent;text-align:left;padding:12px;border-radius:14px;cursor:pointer;display:flex;flex-direction:column;gap:3px;width:100%}
.li.on{background:var(--glass-strong);box-shadow:inset 0 0 0 1px var(--line)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kv div{background:var(--soft);border-radius:14px;padding:10px 12px}
.kv .bad{background:var(--alert-soft);box-shadow:inset 0 0 0 1px var(--alert)}
.tbox{overflow-x:auto;border-radius:16px}
table.t{width:100%;border-collapse:collapse;font-size:14px;min-width:640px}
table.t th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:12px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle;font-variant-numeric:tabular-nums}
table.t tr:last-child td{border-bottom:0}
table.t tr.click{cursor:pointer}
table.t.nw td:not(:last-child){white-space:nowrap}
table.t tr.click:hover td{background:var(--soft)}
.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--solid);border-radius:99px}
.banchi{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px}
.banco{height:36px;border-radius:9px;font-size:11px;font-weight:700;border:0;cursor:pointer}
.banco.fin{background:var(--solid);color:var(--on-solid)}
.banco.run{background:var(--muted);color:var(--on-solid)}
.banco.free{background:var(--glass-strong);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.banco.err{background:var(--alert-soft);color:var(--alert);box-shadow:inset 0 0 0 2px var(--alert)}
.sq{width:13px;height:13px;border-radius:4px;display:inline-block}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;margin-left:6px;border-radius:99px;background:var(--alert);color:#fff;font-size:12px;font-weight:700;line-height:1}
.warn{border-radius:14px;padding:12px 14px;font-weight:700;color:var(--alert);background:var(--alert-soft);box-shadow:inset 0 0 0 1px var(--alert)}
.scaf{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.sc{border:0;border-radius:12px;padding:10px 6px;cursor:pointer;font-weight:700;font-size:13px;display:flex;flex-direction:column;gap:6px;align-items:center;background:var(--glass-strong);box-shadow:inset 0 0 0 1px var(--line);color:var(--ink)}
.sc.on{box-shadow:inset 0 0 0 2px var(--ink)}
.sc .lv{display:grid;grid-template-rows:repeat(6,7px);gap:3px;width:100%}
.sc .lv span{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.sc .lv i{display:block;border-radius:2px;background:var(--soft)}
.sc .lv i.f{background:var(--solid)}
.sc .lv i.h{background:var(--ink)}
.sc .lv i.dim{background:var(--muted);opacity:.35}
.zone{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.zone div{border-radius:12px;padding:10px 12px;background:var(--soft);font-size:13px}
.okrow td:last-child{color:var(--ok);font-weight:700}
.korow td{background:var(--alert-soft)}
.korow td:last-child{color:var(--alert);font-weight:700}
.scanbox{border:2px dashed var(--muted);border-radius:18px;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:16px}

textarea{font:inherit;font-size:15px;line-height:1.5;min-height:110px;border-radius:14px;border:1px solid var(--line);background:var(--glass-strong);color:var(--ink);padding:12px;resize:vertical;width:100%}

/* app su telefono */
.appsec{display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap;justify-content:center}
.appinfo{flex:1 1 300px;max-width:440px;padding:22px}
.appinfo h2{font-size:26px;font-weight:800;letter-spacing:-.03em}
.appinfo ol{margin:12px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.phone{flex:none;width:390px;max-width:100%;height:800px;border-radius:48px;padding:10px;background:var(--frame);box-shadow:var(--shadow)}
.screen{height:100%;border-radius:38px;overflow:hidden;position:relative;background:linear-gradient(180deg,var(--screen1),var(--screen2) 55%,var(--screen1))}
.pscr{position:absolute;inset:0;display:flex;flex-direction:column;gap:12px;padding:22px 16px 16px;overflow-y:auto}
.pcard{background:var(--glass);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid var(--glass-edge);border-radius:18px;box-shadow:var(--shadow)}
.bigbtn{width:100%;font-size:18px;font-weight:800;padding:16px;border-radius:18px;border:2px solid var(--solid);background:var(--solid);color:var(--on-solid);cursor:pointer;min-height:56px}
.bigbtn.ghost{background:var(--glass-strong);color:var(--ink)}
.back{align-self:flex-start;border:0;background:var(--glass-strong);border-radius:999px;font-size:14px;font-weight:600;padding:9px 14px;cursor:pointer;min-height:40px}
.ptitle{font-size:26px;font-weight:800;letter-spacing:-.03em}
.stop{border:1px solid var(--glass-edge);background:var(--glass);border-radius:16px;padding:12px;display:flex;gap:12px;align-items:center;text-align:left;cursor:pointer;width:100%;min-height:68px}
.stop .n{flex:none;width:32px;height:32px;border-radius:99px;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-weight:800}
.stop.done{opacity:.5}
.cam{flex:1;min-height:300px;border-radius:22px;background:#1d1e22;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:18px}
.label{width:100%;max-width:270px;background:#e9e8ee;color:#2b2a31;border-radius:14px;padding:16px;outline:3px solid #ffffff;outline-offset:8px}
.camtxt{color:#e6e6ea;font-size:14px;text-align:center;max-width:280px}
.kvp{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px;gap:10px}
.grades{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.gbtn{font-size:24px;font-weight:800;border-radius:16px;border:2px solid var(--solid);padding:14px 0;cursor:pointer;background:var(--glass-strong);color:var(--ink)}
.gbtn.on{background:var(--solid);color:var(--on-solid)}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:10px}
.round{width:52px;height:52px;border-radius:99px;border:2px solid var(--solid);background:var(--glass-strong);font-size:22px;font-weight:800;cursor:pointer}

/* negozio */
.shop{padding:0;overflow:hidden}
.shophead{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:12px 18px;border-bottom:1px solid var(--line)}
.shopbody{padding:22px 18px 30px}
.shoph1{font-size:clamp(34px,6vw,64px);font-weight:900;letter-spacing:-.05em;line-height:1;margin:16px 0 24px}
.prod{border:1px solid var(--glass-edge);background:var(--glass);border-radius:22px;padding:14px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.ph{aspect-ratio:4/3;max-width:100%;border-radius:16px;background:var(--soft);display:flex;align-items:center;justify-content:center}
.pdet{display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start}
.pdet > *{flex:1 1 360px;min-width:0}
.gradebox{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.gopt{border-radius:16px;padding:12px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px;border:2px solid var(--line);background:var(--glass-strong)}
.gopt.on{border-color:var(--solid);background:var(--solid);color:var(--on-solid)}

@media (max-width:760px){
  .side{flex:1 1 100%;flex-direction:row;overflow-x:auto;padding:8px;gap:4px;align-items:center}
  .side .co{display:none}
  .nav{padding:9px 12px}
  .chead h2{font-size:24px}
  .hero{padding:22px 18px}
}
@media (max-width:520px){
  .brand{display:none}
  .phone{width:100%;height:760px;padding:0;border-radius:30px;background:transparent;box-shadow:none}
  .screen{border-radius:28px;box-shadow:inset 0 0 0 1px var(--line)}
  .banchi{grid-template-columns:repeat(6,minmax(0,1fr))}
  .scaf{grid-template-columns:repeat(3,minmax(0,1fr))}
  .hint b{display:none}
}
@media (max-width:760px){
  body{background-attachment:scroll}
  .search input,textarea{font-size:16px}
  .top{padding:8px;gap:8px;border-radius:18px}
  .tab{padding:8px 12px;font-size:14px}
  .hint{font-size:13px;padding:10px 12px}
  .appsec{flex-direction:column;align-items:stretch;gap:14px}
  .appinfo{order:2;max-width:none;padding:16px}
  .appinfo h2{font-size:20px}
  .phone{order:1;align-self:center}
  .chead .row{width:100%}
  .chead .search{flex:1}
  .chead .search input{width:100%}
  .big{font-size:26px}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .card{padding:14px}
  .gradebox{grid-template-columns:repeat(3,minmax(0,1fr))}
  .shopbody{padding:16px 14px 24px}
  .shophead{padding:10px 12px}
}
@media (max-width:520px){
  .phone{height:calc(100svh - 150px);min-height:600px;max-height:860px}
  .pscr{padding:16px 12px 12px}
  .g4{grid-template-columns:1fr 1fr}
  .kv{grid-template-columns:1fr 1fr}
  .gopt{padding:10px}
  .ptitle{font-size:23px}
}
@media (max-width:360px){
  .g4,.kv{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>

<div class="wrap">
  <header class="top glass">
    <div class="brand">Messina</div>
    <nav class="tabs" id="tabs" aria-label="Parti del programma"></nav>
  </header>
  <main id="app"></main>
</div>

<script>
(function(){
const S = {
  view:'intro',
  t:{sec:'home', cart:'In arrivo', mail:0, mailMsg:'', reply:false, bolla:0, bolleOk:{}, bollaMsg:'', giriOk:false, fattOk:false, nuovaF:false, nfMsg:'', cliente:null, mezzoF:'Sprinter', tpSel:0, autF:'Tutti', giac:0, giacMsg:'', giacPren:{}, magTab:'pianta', magCli:'Tutti', scaf:3, cerca:'', invOn:true, presTab:'oggi', presFix:{}, presMsg:'', allVisti:{}, allMsg:''},
  a:{scr:'lista', cur:0, done:{}, why:{}, foto:{}, fotoInfo:{}, soglia:35, analisi:false, scanned:false, acc:{}, accOpen:false, nav:false},
  c:{sec:'home', cart:'In arrivo', mail:0, mailMsg:'', reply:false, vista:'schede', brand:'Tutti', grado:'Tutti', licOk:false, banco:null, telF:'Tutti', ordMsg:''},
  b:{timb:[], n:0, finto:false},
  m:{scr:'home', inStep:0, inN:0, outN:0, outErr:false, outGo:false, mvStep:0, conta:{}, contaCur:null},
  k:{scr:'scan', grado:'B', difetti:{'Graffi sul coperchio':true}, prezzo:249, canali:{'eBay':true,'Subito':true,'Back Market':true,'Refurbed':true,'Sito':false}, n:12},
  n:{view:'home', brand:'Tutti', pid:0, g:'Buono', ram:16, cart:[], added:false, payMsg:false}
};

const VIEWS=[['intro','Introduzione'],['trasp','Autotrasporti'],['autisti','App autisti'],['magazzino','App magazzino'],['presenze','App presenze'],['corp','Corporation'],['carico','App carico merce'],['negozio','Negozio online']];
const T_NAV=[['home','Home'],['mail','Mail'],['bolle','Bolle'],['traffico','Traffico'],['magazzino','Magazzino'],['giacenze','Giacenze'],['clienti','Clienti'],['fatture','Fatturazione'],['mezzi','Mezzi'],['autisti','Autisti'],['telepass','Telepass'],['presenze','Presenze']];
const C_NAV=[['home','Home'],['mail','Mail'],['lotti','Lotti'],['inv','Inventario'],['ordini','Ordini'],['stage','Stage Computer'],['stageTel','Stage Cellulari']];

const LAPTOP='<svg width="84" height="58" viewBox="0 0 64 44" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="10" y="4" width="44" height="28" rx="2"></rect><path d="M2 38h60l-4 4H6z"></path></svg>';
const SEARCH='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>';
const CLIP='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.5l-8.5 8.5a5 5 0 01-7-7L14 5.5a3.5 3.5 0 015 5L10.5 19"></path></svg>';

const b=(label,act,arg,cls)=>`<button class="btn ${cls||''}" data-act="${act}" data-arg="${arg===undefined?'':arg}">${label}</button>`;
const chip=(label,act,arg,on)=>`<button class="chipbtn ${on?'on':''}" data-act="${act}" data-arg="${arg}">${label}</button>`;
const badge=n=>n>0?`<span class="badge">${n}</span>`:'';
const warn=t=>`<div class="warn">${t}</div>`;
const pill=(t,c)=>`<span class="pill ${c||''}">${t}</span>`;
const srch=(ph,id)=>`<label class="search">${SEARCH}<span class="sr">Cerca</span><input id="${id}" placeholder="${ph}"></label>`;
const msg=(text,btnLabel,act,arg)=>`<div class="msg"><span>${text}</span>${btnLabel?b(btnLabel,act,arg,'sm'):''}</div>`;

function qrSvg(seed){
  const N=25; let h=seed*2654435761>>>0; const rnd=()=>{h^=h<<13;h>>>=0;h^=h>>>17;h^=h<<5;h>>>=0;return h%100;};
  const fin=(x,y)=>{const c=[];for(let i=0;i<7;i++)for(let j=0;j<7;j++){const e=i===0||i===6||j===0||j===6||(i>=2&&i<=4&&j>=2&&j<=4);if(e)c.push(`<rect x="${x+j}" y="${y+i}" width="1" height="1"/>`);}return c.join('');};
  const inF=(x,y)=>(x<8&&y<8)||(x>=N-8&&y<8)||(x<8&&y>=N-8);
  let r='';for(let y=0;y<N;y++)for(let x=0;x<N;x++){if(inF(x,y))continue;if(rnd()<48)r+=`<rect x="${x}" y="${y}" width="1" height="1"/>`;}
  return `<svg viewBox="-2 -2 ${N+4} ${N+4}" width="220" height="220" style="background:#fff;border-radius:12px" shape-rendering="crispEdges" fill="#111" role="img" aria-label="Badge QR">${fin(0,0)}${fin(N-7,0)}${fin(0,N-7)}${r}</svg>`;
}

        <svg width="76" height="76" viewBox="0 0 21 21" aria-hidden="true" shape-rendering="crispEdges" style="flex:none;background:#ffffff;border-radius:6px"><g fill="#111214"><rect x="0" y="0" width="7" height="7"></rect><rect x="14" y="0" width="7" height="7"></rect><rect x="0" y="14" width="7" height="7"></rect></g><g fill="#ffffff"><rect x="1" y="1" width="5" height="5"></rect><rect x="15" y="1" width="5" height="5"></rect><rect x="1" y="15" width="5" height="5"></rect></g><g fill="#111214"><rect x="2" y="2" width="3" height="3"></rect><rect x="16" y="2" width="3" height="3"></rect><rect x="2" y="16" width="3" height="3"></rect><rect x="9" y="1" width="2" height="2"></rect><rect x="8" y="5" width="3" height="1"></rect><rect x="9" y="8" width="4" height="2"></rect><rect x="14" y="9" width="2" height="3"></rect><rect x="17" y="10" width="3" height="2"></rect><rect x="8" y="12" width="2" height="3"></rect><rect x="11" y="14" width="3" height="2"></rect><rect x="15" y="15" width="2" height="2"></rect><rect x="18" y="17" width="2" height="3"></rect><rect x="9" y="17" width="3" height="3"></rect><rect x="1" y="9" width="3" height="2"></rect></g></svg>
        <div style="flex:1;min-width:0"><div class="row between"><b>MESSINA</b><b style="font-size:22px">${k.grado}</b></div><div style="font-size:14px;font-weight:600">ThinkPad T14 Gen 2</div><div class="lbl">PF3XXXXX · lotto L-015 · B3</div></div>
      </div>
      <div class="pcard" style="padding:14px;line-height:1.6">In vendita a <b>€ ${k.prezzo}</b> su ${att.length?att.join(', '):'nessun sito'}. Quando si vende su un sito, sparisce dagli altri.</div>

}

      <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(230px,1fr))">${vis.map(p=>`<button class="prod" data-act="nOpen" data-arg="${p.i}"><span class="ph">${LAPTOP}</span><span class="lbl">${p.brand}</span><b style="font-size:19px;letter-spacing:-.02em">${p.name}</b><span class="lbl">${p.spec}</span><span>da <b style="font-size:20px">€ ${p.base-40}</b></span></button>`).join('')}</div></div>`;
  }
  if(n.view==='prod'){
    const p=SHOP[n.pid], price=nPrice(p,n.g,n.ram);
    inner=`<div class="shopbody"><div style="margin-bottom:14px">${b('Tutti i portatili','nHome','','ghost sm')}</div><div class="pdet">
      <div class="ph" style="border-radius:24px">${LAPTOP}</div>
      <div class="stack">
        <div><div class="lbl">${p.brand}</div><h2 style="font-size:clamp(28px,4vw,40px);font-weight:900;letter-spacing:-.04em;line-height:1.05">${p.name}</h2><div class="muted">${p.spec}</div></div>
        <div style="font-size:42px;font-weight:900;letter-spacing:-.04em">€ ${price}</div>
        <div><b>Condizioni</b><div class="gradebox" style="margin-top:8px">${['Discreto','Buono','Ottimo'].map(g=>`<button class="gopt ${n.g===g?'on':''}" data-act="nG" data-arg="${g}"><span style="font-weight:700">${g}</span><span style="font-size:18px;font-weight:800">€ ${nPrice(p,g,n.ram)}</span></button>`).join('')}</div><p style="margin:10px 0 0" class="muted">${GDESC[n.g]}</p></div>
        <div><b>Memoria</b><div class="row" style="margin-top:8px">${[8,16].map(r=>chip(r+' GB RAM · 256 GB SSD','nRam',r,n.ram===r)).join('')}</div></div>
        <button class="bigbtn" data-act="nAdd">${n.added?'Aggiunto · vai al carrello':'Aggiungi al carrello'}</button>
        <div class="row">${pill('Dati cancellati con metodo certificato')}${pill('Garanzia [mesi]')}${pill('Reso entro [giorni]')}</div>
      </div></div></div>`;
  }
  if(n.view==='cart'){
    const tot=n.cart.reduce((a,c)=>a+c.p,0);

      ${n.cart.length?n.cart.map((c,i)=>`<div class="pcard row between" style="padding:16px;margin-bottom:10px"><div><b style="font-size:17px">${c.name}</b><div class="lbl">${c.det}</div></div><div class="row"><b style="font-size:20px">€ ${c.p}</b>${b('Togli','nRemove',i,'ghost sm')}</div></div>`).join('')+`<div class="row between" style="border-top:1px solid var(--line);padding-top:14px;margin-top:6px"><b>Totale</b><b style="font-size:28px">€ ${tot}</b></div><div style="margin-top:14px">${n.payMsg?msg('Questa è una prova: il pagamento non è attivo.'):`<button class="bigbtn" data-act="nPay">Vai al pagamento</button>`}</div>`:`<div class="pcard" style="padding:24px;text-align:center">Il carrello è vuoto. <div style="margin-top:12px">${b('Guarda i portatili','nHome','','ghost sm')}</div></div>`}

function render(){
  document.getElementById('tabs').innerHTML=tabs();
  const v=S.view, app=document.getElementById('app');
  app.innerHTML = v==='intro'?intro():v==='trasp'?trasp():v==='autisti'?autistiApp():v==='magazzino'?magApp():v==='presenze'?presApp():v==='corp'?corp():v==='carico'?caricoApp():negozio();
  if(window.innerWidth<=760){ const on=document.querySelector('.side .nav.on'); if(on&&on.parentNode) on.parentNode.scrollLeft=on.offsetLeft-on.parentNode.clientWidth/2+on.clientWidth/2; }
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const f=A[el.dataset.act]; if(!f) return;
  e.preventDefault(); f(el.dataset.arg); render();
});
function analizzaFoto(file){
  const cur=S.a.cur; S.a.analisi=true; render();
  const url=URL.createObjectURL(file); const img=new Image();
  img.onload=()=>{
    const W=1000, sc=Math.min(1,W/Math.max(img.naturalWidth,img.naturalHeight));
    const w=Math.round(img.naturalWidth*sc), h=Math.round(img.naturalHeight*sc);
    const cv=document.createElement('canvas'); cv.width=w; cv.height=h; const cx=cv.getContext('2d'); cx.drawImage(img,0,0,w,h);
    const d=cx.getImageData(0,0,w,h).data; const g=new Float32Array(w*h); let sum=0;
    for(let i=0;i<w*h;i++){const v=0.299*d[i*4]+0.587*d[i*4+1]+0.114*d[i*4+2]; g[i]=v; sum+=v;}
    let m=0,m2=0,n=0;
    for(let y=1;y<h-1;y++) for(let x=1;x<w-1;x++){const i=y*w+x; const l=4*g[i]-g[i-1]-g[i+1]-g[i-w]-g[i+w]; m+=l; m2+=l*l; n++;}
    const score=Math.round(m2/n-(m/n)*(m/n)), luce=Math.round(sum/(w*h)), lato=Math.min(img.naturalWidth,img.naturalHeight);
    const info={url:url,score:score,luce:luce};
    if(lato<700){info.titolo='Foto troppo piccola'; info.consiglio='Usa la fotocamera, non uno screenshot o una foto ridotta.';}
    else if(luce<55){info.titolo='Foto troppo scura'; info.consiglio='Spostati verso la luce o accendi il flash.';}
    else if(score<S.a.soglia){info.titolo='Foto sfocata: la bolla non si legge'; info.consiglio='Appoggia la bolla su un piano, tieni fermo il telefono e inquadrala tutta.';}
    S.a.fotoInfo[cur]=info; S.a.foto[cur]=info.titolo?1:2; S.a.analisi=false; render();
  };
  img.onerror=()=>{S.a.fotoInfo[cur]={titolo:'Foto non leggibile',consiglio:'Riprova con la fotocamera del telefono.'}; S.a.foto[cur]=1; S.a.analisi=false; render();};
  img.src=url;
}
document.addEventListener('change',e=>{
  if(e.target.id==='fotoBolla'&&e.target.files&&e.target.files[0]) analizzaFoto(e.target.files[0]);
  if(e.target.id==='soglia'){S.a.soglia=+e.target.value; render();}
});
setInterval(()=>{
  const el=document.getElementById('qrleft'); if(!el) return;
  const left=30-Math.floor(Date.now()/1000)%30; el.textContent=left;
  if(left===30){const bx=document.getElementById('qrbox'); if(bx) bx.innerHTML=qrSvg(Math.floor(Date.now()/30000));}
},1000);
render();
})();
