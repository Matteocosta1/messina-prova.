u003ctext x=\"262\" y=\"152\">Piacenza\u003c/text>\u003c/g>\u003cg class=\"citta\" style=\"--i:8\">\u003ccircle cx=\"418\" cy=\"226\" r=\"4\"/>\u003ctext x=\"418\" y=\"243\" text-anchor=\"middle\">Bologna\u003c/text>\u003c/g>\u003cg class=\"citta\" style=\"--i:9\">\u003ccircle cx=\"177\" cy=\"237\" r=\"4\"/>\u003ctext x=\"177\" y=\"254\" text-anchor=\"middle\">Genova\u003c/text>\u003c/g>\u003cg class=\"base\">\u003ccircle class=\"r\" cx=\"197\" cy=\"110\" r=\"7\"/>\u003ccircle class=\"c\" cx=\"197\" cy=\"110\" r=\"7\"/>\u003ctext x=\"191\" y=\"144\" text-anchor=\"end\">Lacchiarella\u003c/text>\u003c/g>\u003c/svg>\u003c/div>\n  \u003c/div>\u003c/section>\u003csection style=\"padding-top:0\">\u003cdiv class=\"wrap\">\n    \u003cdiv class=\"sh\">\u003ch2>Domande frequenti.\u003c/h2>\u003cspan>\u003c/span>\u003c/div>\n    \u003cdiv class=\"faq glass\">\u003cdetails>\u003csummary>In quanto tempo consegnate?\u003c/summary>\u003cdiv>Nel Nord Italia di solito in giornata o il giorno lavorativo dopo il ritiro, a seconda di zona e orario. Per consegne con appuntamento concordiamo la data con il destinatario.\u003c/div>\u003c/details>\u003cdetails>\u003csummary>Consegnate di sabato?\u003c/summary>\u003cdiv>Sì, il sabato mattina su richiesta. La domenica solo per lavori concordati.\u003c/div>\u003c/details>\u003cdetails>\u003csummary>Posso sapere dov'è la mia spedizione?\u003c/summary>\u003cdiv>Sì: con il numero della bolla nella pagina \u003ca href=\"/traccia/\">Traccia\u003c/a>, oppure dall'area clienti con tutte le vostre spedizioni.\u003c/div>\u003c/details>\u003c/div>\n  \u003c/div>\u003c/section>\u003c/main>\n\u003cmain data-path=\"/servizi/magazzino/\" data-titolo=\"Magazzino e logistica | Messina Autotrasporti\" hidden>\u003cdiv class=\"ph\">\u003cdiv class=\"wrap\">\n    \u003cnav class=\"briciole\" aria-label=\"Sei qui\">\u003ca href=\"/\">Home\u003c/a> \u003cspan aria-hidden=\"true\">/\u003c/span> \u003ca href=\"/servizi/\">Servizi\u003c/a> \u003cspan aria-hidden=\"true\">/\u003c/span> \u003cspan>Magazzino\u003c/span>\u003c/nav>\n    \u003ch1>Magazzino e logistica\u003c/h1>\n    \u003cp class=\"lead\">Il nostro polo di Lacchiarella lavora dalle 6 del mattino fino a notte: riceve, custodisce, prepara e spedisce la vostra merce.\u003c/p>\n  \u003c/div>\u003c/div>\u003csection>\u003cdiv class=\"wrap mag\">\u003cdiv>\u003ch2 class=\"h2\">Ogni bancale ha un posto.\u003c/h2>\n    \u003cp class=\"muted\" style=\"margin-top:16px;max-width:46ch\">Scaffali a 6 piani, ogni posto con il suo codice (per esempio S03-2-1: scaffale 3, piano 2, posto 1) e la sua etichetta. Il magazziniere spara il bancale e il posto: il sistema sa sempre dove si trova ogni cosa.\u003c/p>\n    \u003cul class=\"punti\">\u003cli>Contenuto di ogni bancale, anche misto\u003c/li>\u003cli>Storico di chi ha mosso cosa e quando\u003c/li>\u003cli>Inventari a rotazione, senza fermare il magazzino\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"portale-mini glass\" aria-label=\"Esempio dell'area clienti\">\n  \u003cdiv class=\"testa\">\u003cb>I vostri bancali\u003c/b>\u003cspan>Area clienti\u003c/span>\u003c/div>\n  \u003ctable>\u003cthead>\u003ctr>\u003cth>Codice\u003c/th>\u003cth>Posto\u003c/th>\u003cth>Dal\u003c/th>\u003cth>Stato\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n    \u003ctr>\u003ctd>B-1042\u003c/td>\u003ctd>S03-2-4\u003c/td>\u003ctd>2 ott\u003c/td>\u003ctd>\u003cspan class=\"stato\">In magazzino\u003c/span>\u003c/td>\u003c/tr>\n    \u003ctr>\u003ctd>B-1043\u003c/td>\u003ctd>S03-2-5\u003c/td>\u003ctd>2 ott\u003c/td>\u003ctd>\u003cspan class=\"stato\">In magazzino\u003c/span>\u003c/td>\u003c/tr>\n    \u003ctr>\u003ctd>B-1077\u003c/td>\u003ctd>S05-1-1\u003c/td>\u003ctd>9 ott\u003c/td>\u003ctd>\u003cspan class=\"stato esce\">In uscita\u003c/span>\u003c/td>\u003c/tr>\n    \u003ctr>\u003ctd>B-1081\u003c/td>\u003ctd>S01-4-2\u003c/td>\u003ctd>14 ott\u003c/td>\u003ctd>\u003cspan class=\"stato\">In magazzino\u003c/span>\u003c/td>\u003c/tr>\n  \u003c/tbody>\u003c/table>\n  \u003cdiv class=\"piede\">\u003cspan>Richiedi riconsegna\u003c/span>\u003c/div>\n\u003c/div>\u003c/div>\u003c/section>\u003csection style=\"padding-top:0\">\u003cdiv class=\"wrap\">\n    \u003cdiv class=\"sh\">\u003ch2>Cosa facciamo in magazzino.\u003c/h2>\u003cspan>\u003c/span>\u003c/div>\n    \u003cdiv class=\"servizi glass\">\n  \u003cdiv class=\"srv\">\n    \u003ch3>Stoccaggio\u003c/h3>\n    \u003cdiv>\u003cp>Custodia di bancali e colli in area dedicata per cliente, con giacenze sempre aggiornate.\u003c/p>\u003c/div>\n    \u003cspan class=\"tag\">Conto terzi\u003c/span>\n  \u003c/div>\n  \u003cdiv class=\"srv\">\n    \u003ch3>Ricevimento\u003c/h3>\n    \u003cdiv>\u003cp>Controlliamo quantità e codici all'arrivo e segnaliamo subito differenze rispetto al documento di trasporto.\u003c/p>\u003c/div>\n    \u003cspan class=\"tag\">Con scanner\u003c/span>\n  \u003c/div>\n  \u003cdiv class=\"srv\">\n    \u003ch3>Preparazione ordini\u003c/h3>\n    \u003cdiv>\u003cp>Prepariamo le spedizioni dai vostri ordini, anche per singolo destinatario, con etichette e documenti.\u003c/p>\u003c/div>\n    \u003cspan class=\"tag\">Pick and pack\u003c/span>\n  \u003c/div>\n  \u003cdiv class=\"srv\">\n    \u003ch3>Merce di passaggio\u003c/h3>\n    \u003cdiv>\u003cp>Merce che entra al mattino e riparte nei giri dello stesso giorno, senza andare a scaffale.\u003c/p>\u003c/div>\n    \u003cspan class=\"tag\">In giornata\u003c/span>\n  \u003c/div>\n  \u003cdiv class=\"srv\">\n    \u003ch3>Inventari\u003c/h3>\n    \u003cdiv>\u003cp>Conte programmate posto per posto: niente si chiude finché i numeri non tornano.\u003c/p>\u003c/div>\n    \u003cspan class=\"tag\">Su richiesta\u003c/span>\n  \u003c/div>\u003c/div>\n  \u003c/div>\u003c/section>\u003csection style=\"padding-top:0\">\u003cdiv class=\"wrap\">\n    \u003cdiv class=\"sh\">\u003ch2>Cosa vedete voi.\u003c/h2>\u003cp>Nell'area clienti trovate giacenze, movimenti e seriali in tempo reale. Se il vostro sistema lo richiede, ogni notte vi mandiamo anche un file con tutti i movimenti del giorno.\u003c/p>\u003c/div>\n    \u003col class=\"passi glass\">\u003cli>\u003cb>Giacenze dal vivo\u003c/b>\u003cspan>Ogni bancale con posto e data.\u003c/span>\u003c/li>\u003cli>\u003cb>Seriali\u003c/b>\u003cspan>Per la merce tracciata pezzo per pezzo.\u003c/span>\u003c/li>\u003cli>\u003cb>Riconsegne\u003c/b>\u003cspan>Richieste online con la data che volete.\u003c/span>\u003c/li>\u003cli>\u003cb>File giornaliero\u003c/b>\u003cspan>Excel o CSV ogni notte, se serve.\u003c/span>\u003c/li>\u003c/ol>\n  \u003c/div>\u003c/section>\u003c/main>\n\u003cmain data-path=\"/servizi/logistica-it/\" data-titolo=\"Logistica IT | Messina Autotrasporti\" hidden>\u003cdiv class=\"ph\">\u003cdiv class=\"wrap\">\n    \u003cnav class=\"briciole\" aria-label=\"Sei qui\">\u003ca href=\"/\">Home\u003c/a> \u003cspan aria-hidden=\"true\">/\u003c/span> \u003ca href=\"/servizi/\">Servizi\u003c/a> \u003cspan aria-hidden=\"true\">/\u003c/span> \u003cspan>Logistica IT\u003c/span>\u003c/nav>\n    \u003ch1>Logistica IT\u003c/h1>\n    \u003cp class=\"lead\">Portiamo PC e telefoni aziendali a ogni dipendente, pronti all'uso, e ritiriamo quelli vecchi. Ogni dispositivo è tracciato per numero di serie o IMEI.\u003c/p>\n  \u003c/div>\u003c/div>\u003csection>\u003cdiv class=\"wrap\">\n    \u003cdiv class=\"sh\">\u003ch2>Rinnovi di flotte aziendali.\u003c/h2>\u003cp>Gestiamo progetti da migliaia di dispositivi per banche, assicurazioni e grandi aziende, anche attraverso i loro fornitori IT.\u003c/p>\u003c/div>\n    \u003col class=\"passi glass\">\u003cli>\u003cb>Ingresso\u003c/b>\u003cspan>Ogni dispositivo letto con lo scanner all'arrivo.\u003c/span>\u003c/li>\u003cli>\u003cb>Preparazione\u003c/b>\u003cspan>Etichette cespite, accessori e imballo per utente.\u003c/span>\u003c/li>\u003cli>\u003cb>Spedizione\u003c/b>\u003cspan>Alla sede o al dipendente, con etichette nominative.\u003c/span>\u003c/li>\u003cli>\u003cb>Reso\u003c/b>\u003cspan>Busta con etichetta di reso per il dispositivo vecchio.\u003c/span>\u003c/li>\u003cli>\u003cb>Rendiconto\u003c/b>\u003cspan>IMEI, cespite e utente in un file ogni giorno.\u003c/span>\u003c/li>\u003c/ol>\n  \u003c/div>\u003c/section>\u003csection style=\"padding-top:0\">\u003cdiv class=\"wrap\">\n    \u003cdiv class=\"sh\">\u003ch2>Cosa possiamo fare per ogni dispositivo.\u003c/h2>\u003cspan>\u003c/span>\u003c/div>\n    \u003cdiv class=\"servizi glass\">\n  \u003cdiv class=\"srv\">\n    \u003ch3>Doppio cespite\u003c/h3>\n    \u003cdiv>\u003cp>Applichiamo le etichette cespite sul dispositivo e sulla scatola. Il lavoro non si chiude finché le due letture non coincidono.\u003c/p>\u003c/div>\n    \u003cspan class=\"tag\">Telefono e scatola\u003c/span>\n  \u003c/div>\n  \u003cdiv class=\"srv\">\n    \u003ch3>Accessori per utente\u003c/h3>\n    \u003cdiv>\u003cp>Caricabatterie, cavi, cover: aggiunti solo a chi li ha richiesti, secondo l'elenco che ci mandate.\u003c/p>\u003c/div>\n    \u003cspan class=\"tag\">Su richiesta\u003c/span>\n  \u003c/div>\n  \u003cdiv class=\"srv\">\n    \u003ch3>Formattazione e test\u003c/h3>\n    \u003cdiv>\u003cp>I dispositivi che rientrano vengono cancellati con software certificato e testati nel nostro stage da 60 postazioni.\u003c/p>\u003c/div>\n    \u003cspan class=\"tag\">Con Messina Corporation\u003c/span>\n  \u003c/div>\n  \u003cdiv class=\"srv\">\n    \u003ch3>Portale dedicato\u003c/h3>\n    \u003cdiv>\u003cp>Il vostro referente vede ingressi, preparazioni e spedizioni in tempo reale, con tutti i seriali.\u003c/p>\u003c/div>\n    \u003cspan class=\"tag\">Dal vivo\u003c/span>\n  \u003c/div>\u003c/div>\n  \u003c/div>\u003c/section>\u003csection style=\"padding-top:0\">\u003cdiv class=\"wrap\">\u003cdiv class=\"banda\">\u003cdiv>\u003ch2>Dispositivi a fine vita?\u003c/h2>\u003cp>Ritiro, cancellazione certificata dei dati e valutazione dei lotti li fa Messina Corporation, la nostra società sorella, nello stesso polo di Lacchiarella.\u003c/p>\u003c/div>\u003ca class=\"btn\" href=\"#\" data-link=\"corporationUrl\">Messina Corporation\u003c/a>\u003c/div>\u003c/div>\u003c/section>\u003c/main>\n\u003cmain data-path=\"/servizi/giacenze-resi/\" data-titolo=\"Giacenze e resi | Messina Autotrasporti\" hidden>\u003cdiv class=\"ph\">\u003cdiv class=\"wrap\">\n    \u003cnav class=\"briciole\" aria-label=\"Sei qui\">\u003ca href=\"/\">Home\u003c/a> \u003cspan aria-hidden=\"true\">/\u003c/span> \u003ca href=\"/servizi/\">Servizi\u003c/a> \u003cspan aria-hidden=\"true\">/\u003c/span> \u003cspan>Giacenze e resi\u003c/span>\u003c/nav>\n    \u003ch1>Giacenze e resi\u003c/h1>\n    \u003cp class=\"lead\">Una consegna non riuscita non è una spedizione persa: la merce torna al sicuro e voi decidete cosa fare.\u003c/p>\n  \u003c/div>\u003c/div>\u003csection>\u003cdiv class=\"wrap\">\n    \u003cdiv class=\"sh\">\u003ch2>Cosa succede se il destinatario non c'è.\u003c/h2>\u003cspan>\u003c/span>\u003c/div>\n    \u003col class=\"passi glass\">\u003cli>\u003cb>Tentativo\u003c/b>\u003cspan>L'autista registra il motivo con l'app.\u003c/span>\u003c/li>\u003cli>\u003cb>Avviso\u003c/b>\u003cspan>Vi scriviamo il giorno stesso.\u003c/span>\u003c/li>\u003cli>\u003cb>Magazzino\u003c/b>\u003cspan>La merce rientra a Lacchiarella, in area giacenze.\u003c/span>\u003c/li>\u003cli>\u003cb>Decisione\u003c/b>\u003cspan>Riconsegna, reso al mittente o ritiro in sede.\u003c/span>\u003c/li>\u003cli>\u003cb>Riconsegna\u003c/b>\u003cspan>Nella data che indicate voi.\u003c/span>\u003c/li>\u003c/ol>\n  \u003c/div>\u003c/section>\u003csection style=\"padding-top:0\">\u003cdiv class=\"wrap\">\n    \u003cdiv class=\"sh\">\u003ch2>Costi chiari.\u003c/h2>\u003cp>La giacenza ha un costo giornaliero di deposito e la riconsegna si paga come una nuova consegna, secondo le tariffe del vostro contratto. Dall'area clienti vedete ogni giacenza aperta e da quanti giorni.\u003c/p>\u003c/div>\n    \u003cdiv class=\"faq glass\">\u003cdetails>\u003csummary>Quanto resta la merce in giacenza?\u003c/summary>\u003cdiv>Finché non ci date istruzioni, fino al termine previsto dal contratto. Oltre quel termine vi contattiamo per il reso al mittente.\u003c/div>\u003c/details>\u003cdetails>\u003csummary>Posso chiedere la riconsegna online?\u003c/summary>\u003cdiv>Sì, dall'area clienti: scegliete la data e il nostro ufficio la conferma inserendola nel giro.\u003c/div>\u003c/details>\u003cdetails>\u003csummary>Gestite anche i resi dei miei clienti?\u003c/summary>\u003cdiv>Sì: ritiriamo la merce resa, la controlliamo all'ingresso e la rimettiamo a scaffale o ve la riportiamo, come preferite.\u003c/div>\u003c/details>\u003c/div>\n  \u003c/div>\u003c/section>\u003c/main>\n\u003cmain data-path=\"/settori/\" data-titolo=\"Settori | Messina Autotrasporti\" hidden>\u003cdiv class=\"ph\">\u003cdiv class=\"wrap\">\n    \u003cnav class=\"briciole\" aria-label=\"Sei qui\">\u003ca href=\"/\">Home\u003c/a> \u003cspan aria-hidden=\"true\">/\u003c/span> \u003cspan>Settori\u003c/span>\u003c/nav>\n    \u003ch1>Settori\u003c/h1>\n    \u003cp class=\"lead\">Ogni settore ha le sue regole di consegna. Le conosciamo perché le seguiamo ogni giorno.\u003c/p>\n  \u003c/div>\u003c/div>\u003csection>\u003cdiv class=\"wrap\">\n    \n    \u003cdiv class=\"servizi glass\">\n  \u003cdiv class=\"srv\">\n    \u003ch3>Tecnologia ed elettronica\u003c/h3>\n    \u003cdiv>\u003cp>Distribuzione di prodotti di elettronica nel Nord Italia, con merce di alto valore tracciata collo per collo e consegne su appuntamento.\u003c/p>\u003c/div>\n    \u003cspan class=\"tag\">Seriali\u003c/span>\n  \u003c/div>\n  \u003cdiv class=\"srv\">\n    \u003ch3>Energia e impianti\u003c/h3>\n    \u003cdiv>\u003cp>Materiali per cantieri e sedi tecniche, con magazzino dedicato e seriali visibili al cliente 24 ore su 24.\u003c/p>\u003c/div>\n    \u003cspan class=\"tag\">Portale dal vivo\u003c/span>\n  \u003c/div>\n  \u003cdiv class=\"srv\">\n    \u003ch3>\u003ca href=\"/servizi/logistica-it/\">Banche e assicurazioni\u003c/a>\u003c/h3>\n    \u003cdiv>\u003cp>Rinnovi di telefoni e PC per migliaia di dipendenti, con etichette cespite, accessori per utente e resi.\u003c/p>\u003cp class=\"vai\">\u003ca href=\"/servizi/logistica-it/\">Logistica IT\u003c/a>\u003c/p>\u003c/div>\n    \u003cspan class=\"tag\">IMEI e cespiti\u003c/span>\n  \u003c/div>\n  \u003cdiv class=\"srv\">\n    \u003ch3>Beverage\u003c/h3>\n    \u003cdiv>\u003cp>Consegne a ristoranti, enoteche e privati con prenotazione, consegna al piano o in cantina.\u003c/p>\u003c/div>\n    \u003cspan class=\"tag\">Consegna in cantina\u003c/span>\n  \u003c/div>\n  \u003cdiv class=\"srv\">\n    \u003ch3>Cosmetica e retail\u003c/h3>\n    \u003cdiv>\u003cp>Rifornimento di negozi e corner con finestre orarie precise e consegna con sponda.\u003c/p>\u003c/div>\n    \u003cspan class=\"tag\">Punti vendita\u003c/span>\n  \u003c/div>\n  \u003cdiv class=\"srv\">\n    \u003ch3>E-commerce\u003c/h3>\n    \u003cdiv>\u003cp>Preparazione ordini, consegna al cliente finale e gestione dei resi dal nostro magazzino.\u003c/p>\u003c/div>\n    \u003cspan class=\"tag\">Resi\u003c/span>\n  \u003c/div>\u003c/div>\n  \u003c/div>\u003c/section>\u003csection style=\"padding-top:0\">\u003cdiv class=\"wrap\">\u003cdiv class=\"banda\">\u003cdiv>\u003ch2>Il vostro settore non c'è?\u003c/h2>\u003cp>Raccontateci cosa spedite: la maggior parte dei nostri servizi nasce dalla richiesta di un cliente.\u003c/p>\u003c/div>\u003ca class=\"btn\" href=\"/preventivo/\">Chiedi un preventivo\u003c/a>\u003c/div>\u003c/div>\u003c/section>\u003c/main>\n\u003cmain data-path=\"/flotta/\" data-titolo=\"Flotta | Messina Autotrasporti\" hidden>\u003cdiv class=\"ph\">\u003cdiv class=\"wrap\">\n    \u003cnav class=\"briciole\" aria-label=\"Sei qui\">\u003ca href=\"/\">Home\u003c/a> \u003cspan aria-hidden=\"true\">/\u003c/span> \u003cspan>Flotta\u003c/span>\u003c/nav>\n    \u003ch1>Flotta\u003c/h1>\n    \u003cp class=\"lead\">Circa 30 mezzi, quasi tutti con sponda idraulica. Ogni mezzo ha il suo autista: lo conosce e lo tiene in ordine.\u003c/p>\n  \u003c/div>\u003c/div>\u003csection>\u003cdiv class=\"wrap\">\n    \n    \u003cdiv class=\"strada\" role=\"list\">\n  \u003cdiv class=\"mezzo m1\" role=\"listitem\">\u003csvg viewBox=\"0 0 200 104\" aria-hidden=\"true\">\u003cpath class=\"t\" d=\"M6 92 V40 Q6 28 18 26 L118 22 Q132 22 140 32 L176 58 Q194 62 194 76 V92 Z\"/>\u003cpath class=\"v\" d=\"M124 34 L166 60 H124 Z\" opacity=\".85\"/>\u003ccircle class=\"ruota\" cx=\"44\" cy=\"92\" r=\"12\"/>\u003ccircle class=\"cerchio\" cx=\"44\" cy=\"92\" r=\"4.32\"/>\u003ccircle class=\"ruota\" cx=\"158\" cy=\"92\" r=\"12\"/>\u003ccircle class=\"cerchio\" cx=\"158\" cy=\"92\" r=\"4.32\"/>\u003c/svg>\u003cdiv class=\"solo-tel\">\u003ch3>Furgoni e Sprinter\u003c/h3>\u003cp>Città, consegne veloci, ZTL.\u003c/p>\u003c/div>\u003c/div>\n  \u003cdiv class=\"mezzo m2\" role=\"listitem\">\u003csvg viewBox=\"0 0 320 150\" aria-hidden=\"true\">\u003crect class=\"t\" x=\"6\" y=\"10\" width=\"214\" height=\"118\" rx=\"6\"/>\u003cpath class=\"t\" d=\"M226 128 V58 Q226 46 238 46 H280 Q292 46 298 58 L314 94 V128 Z\"/>\u003cpath class=\"v\" d=\"M240 58 H278 L292 88 H240 Z\" opacity=\".85\"/>\u003crect class=\"v\" x=\"6\" y=\"128\" width=\"214\" height=\"5\"/>\u003ccircle class=\"ruota\" cx=\"48\" cy=\"134\" r=\"14\"/>\u003ccircle class=\"cerchio\" cx=\"48\" cy=\"134\" r=\"5.04\"/>\u003ccircle class=\"ruota\" cx=\"84\" cy=\"134\" r=\"14\"/>\u003ccircle class=\"cerchio\" cx=\"84\" cy=\"134\" r=\"5.04\"/>\u003ccircle class=\"ruota\" cx=\"276\" cy=\"134\" r=\"14\"/>\u003ccircle class=\"cerchio\" cx=\"276\" cy=\"134\" r=\"5.04\"/>\u003c/svg>\u003cdiv class=\"solo-tel\">\u003ch3>Motrici e tre assi\u003c/h3>\u003cp>Con sponda, per bancali e consegne al piano.\u003c/p>\u003c/div>\u003c/div>\n  \u003cdiv class=\"mezzo m3\" role=\"listitem\">\u003csvg viewBox=\"0 0 480 160\" aria-hidden=\"true\">\u003crect class=\"t\" x=\"6\" y=\"8\" width=\"372\" height=\"124\" rx=\"6\"/>\u003crect class=\"v\" x=\"6\" y=\"132\" width=\"372\" height=\"5\"/>\u003cpath class=\"t\" d=\"M386 140 V64 Q386 52 398 52 H440 Q452 52 458 64 L474 100 V140 Z\"/>\u003cpath class=\"v\" d=\"M400 64 H438 L452 94 H400 Z\" opacity=\".85\"/>\u003ccircle class=\"ruota\" cx=\"250\" cy=\"144\" r=\"14\"/>\u003ccircle class=\"cerchio\" cx=\"250\" cy=\"144\" r=\"5.04\"/>\u003ccircle class=\"ruota\" cx=\"284\" cy=\"144\" r=\"14\"/>\u003ccircle class=\"cerchio\" cx=\"284\" cy=\"144\" r=\"5.04\"/>\u003ccircle class=\"ruota\" cx=\"318\" cy=\"144\" r=\"14\"/>\u003ccircle class=\"cerchio\" cx=\"318\" cy=\"144\" r=\"5.04\"/>\u003ccircle class=\"ruota\" cx=\"410\" cy=\"144\" r=\"14\"/>\u003ccircle class=\"cerchio\" cx=\"410\" cy=\"144\" r=\"5.04\"/>\u003ccircle class=\"ruota\" cx=\"446\" cy=\"144\" r=\"14\"/>\u003ccircle class=\"cerchio\" cx=\"446\" cy=\"144\" r=\"5.04\"/>\u003c/svg>\u003cdiv class=\"solo-tel\">\u003ch3>Bilici\u003c/h3>\u003cp>Carichi completi e tratte lunghe.\u003c/p>\u003c/div>\u003c/div>\n\u003c/div>\n\u003cdiv class=\"mezzi-testo\">\n  \u003cdiv>\u003ch3>Furgoni e Sprinter\u003c/h3>\u003cp>Città, consegne veloci, ZTL.\u003c/p>\u003c/div>\n  \u003cdiv>\u003ch3>Motrici e tre assi\u003c/h3>\u003cp>Con sponda, per bancali e consegne al piano.\u003c/p>\u003c/div>\n  \u003cdiv>\u003ch3>Bilici\u003c/h3>\u003cp>Carichi completi e tratte lunghe.\u003c/p>\u003c/div>\n\u003c/div>\n  \u003c/div>\u003c/section>\u003csection style=\"padding-top:0\">\u003cdiv class=\"wrap\">\n    \u003cdiv class=\"sh\">\u003ch2>Cosa porta ogni mezzo.\u003c/h2>\u003cp>Valori indicativi: per carichi particolari verifichiamo misure e peso prima di partire.\u003c/p>\u003c/div>\n    \u003cdiv class=\"tabella glass\">\u003ctable>\n    \u003cthead>\u003ctr>\u003cth>Mezzo\u003c/th>\u003cth>Portata indicativa\u003c/th>\u003cth>Ideale per\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n    \u003ctr>\u003ctd>\u003cb>Sprinter e furgoni\u003c/b>\u003c/td>\u003ctd>Fino a 4 bancali, circa 1.000 kg\u003c/td>\u003ctd>Città, ZTL, consegne veloci e a domicilio\u003c/td>\u003c/tr>\n    \u003ctr>\u003ctd>\u003cb>Motrici\u003c/b>\u003c/td>\u003ctd>Fino a 18 bancali\u003c/td>\u003ctd>Distribuzione con sponda, consegne al piano\u003c/td>\u003c/tr>\n    \u003ctr>\u003ctd>\u003cb>Tre assi\u003c/b>\u003c/td>\u003ctd>Fino a 20 bancali\u003c/td>\u003ctd>Carichi pesanti e consegne multiple\u003c/td>\u003c/tr>\n    \u003ctr>\u003ctd>\u003cb>Bilici\u003c/b>\u003c/td>\u003ctd>Fino a 33 bancali\u003c/td>\u003ctd>Carichi completi e tratte lunghe\u003c/td>\u003c/tr>\n    \u003c/tbody>\u003c/table>\u003c/div>\n  \u003c/div>\u003c/section>\u003csection style=\"padding-top:0\">\u003cdiv class=\"wrap\">\n    \u003cdiv class=\"sh\">\u003ch2>Mezzi seguiti ogni giorno.\u003c/h2>\u003cspan>\u003c/span>\u003c/div>\n    \u003cdiv class=\"servizi glass\">\n  \u003cdiv class=\"srv\">\n    \u003ch3>Manutenzione interna\u003c/h3>\n    \u003cdiv>\u003cp>Un meccanico interno controlla i mezzi e programma tagliandi e revisioni.\u003c/p>\u003c/div>\n    \u003cspan class=\"tag\">Officina\u003c/span>\n  \u003c/div>\n  \u003cdiv class=\"srv\">\n    \u003ch3>Un autista, un mezzo\u003c/h3>\n    \u003cdiv>\u003cp>Ogni mezzo è affidato sempre alla stessa persona: più cura, meno guasti, responsabilità chiara.\u003c/p>\u003c/div>\n    \u003cspan class=\"tag\">Assegnazione fissa\u003c/span>\n  \u003c/div>\n  \u003cdiv class=\"srv\">\n    \u003ch3>Giri calcolati per camion\u003c/h3>\n    \u003cdiv>\u003cp>Percorsi che tengono conto di altezze, pesi e ZTL: meno chilometri, meno gasolio, consegne più puntuali.\u003c/p>\u003c/div>\n    \u003cspan class=\"tag\">Meno chilometri\u003c/span>\n  \u003c/div>\u003c/div>\n  \u003c/div>\u003c/section>\u003c/main>\n\u003cmain data-path=\"/azienda/\" data-titolo=\"Chi siamo | Messina Autotrasporti\" hidden>\u003cdiv class=\"ph\">\u003cdiv class=\"wrap\">\n    \u003cnav class=\"briciole\" aria-label=\"Sei qui\">\u003ca href=\"/\">Home\u003c/a> \u003cspan aria-hidden=\"true\">/\u003c/span> \u003cspan>Azienda\u003c/span>\u003c/nav>\n    \u003ch1>Un'azienda di famiglia, dal 2000.\u003c/h1>\n    \u003cp class=\"lead\">Messina Autotrasporti nasce nel 2000 da Sara Messina e Tiziano Costa. Oggi in azienda lavora anche la seconda generazione, Matteo e Pierpaolo Costa.\u003c/p>\n  \u003c/div>\u003c/div>\u003csection>\u003cdiv class=\"wrap\">\u003cdiv class=\"storia glass\">\n    \u003cdiv>\u003cb>2000\u003c/b>\u003cspan>Sara Messina e Tiziano Costa fondano l'azienda a Lacchiarella.\u003c/span>\u003c/div>\n    \u003cdiv>\u003cb>2021\u003c/b>\u003cspan>Tra le aziende europee a crescita più rapida nella classifica FT 1000 del Financial Times.\u003c/span>\u003c/div>\n    \u003cdiv>\u003cb>2023\u003c/b>\u003cspan>Nasce Messina Corporation per dare una seconda vita ai dispositivi aziendali.\u003c/span>\u003c/div>\n    \u003cdiv>\u003cb>Oggi\u003c/b>\u003cspan>Circa 30 mezzi, un polo logistico a Lacchiarella e un sistema digitale nuovo per ogni passaggio.\u003c/span>\u003c/div>\n  \u003c/div>\u003c/div>\u003c/section>\u003csection style=\"padding-top:0\">\u003cdiv class=\"wrap\">\n    \u003cdiv class=\"sh\">\u003ch2>In cosa crediamo.\u003c/h2>\u003cspan>\u003c/span>\u003c/div>\n    \u003cdiv class=\"servizi glass\">\n  \u003cdiv class=\"srv\">\n    \u003ch3>Il cliente al centro\u003c/h3>\n    \u003cdiv>\u003cp>Ogni cliente ha esigenze diverse: tariffe, accessori e regole di consegna sono scritte nel suo contratto e rispettate a ogni bolla.\u003c/p>\u003c/div>\n    \u003cspan>\u003c/span>\n  \u003c/div>\n  \u003cdiv class=\"srv\">\n    \u003ch3>Persone\u003c/h3>\n    \u003cdiv>\u003cp>Autisti e magazzinieri sono il nostro servizio. Mezzi in ordine, strumenti semplici, formazione continua.\u003c/p>\u003c/div>\n    \u003cspan>\u003c/span>\n  \u003c/div>\n  \u003cdiv class=\"srv\">\n    \u003ch3>Sostenibilità\u003c/h3>\n    \u003cdiv>\u003cp>Giri più corti, mezzi seguiti dal nostro meccanico e, con Messina Corporation, dispositivi che tornano a essere usati invece di diventare rifiuti.\u003c/p>\u003c/div>\n    \u003cspan>\u003c/span>\n  \u003c/div>\n  \u003cdiv class=\"srv\">\n    \u003ch3>Innovazione\u003c/h3>\n    \u003cdiv>\u003cp>Prova di consegna digitale, magazzino a scanner e portale clienti dal vivo: la tecnologia serve a sbagliare meno.\u003c/p>\u003c/div>\n    \u003cspan>\u003c/span>\n  \u003c/div>\u003c/div>\n  \u003c/div>\u003c/section>\u003csection style=\"padding-top:0\">\u003cdiv class=\"wrap\">\n    \u003cdiv class=\"sh\">\u003ch2>La nostra sede.\u003c/h2>\u003cspan>\u003c/span>\u003c/div>\n    \u003cdiv class=\"mag\" style=\"align-items:start\">\u003cdl class=\"dati\">\u003cdiv>\u003cdt>Indirizzo\u003c/dt>\u003cdd>Via Cascina Nuova 1, 20084 Lacchiarella (MI), località Villamaggiore\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Magazzino\u003c/dt>\u003cdd>Dalle 6 del mattino fino a notte, dal lunedì al venerdì; sabato su richiesta\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Società sorella\u003c/dt>\u003cdd>\u003ca href=\"#\" data-link=\"corporationUrl\">Messina Corporation\u003c/a>, nello stesso polo\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Documenti\u003c/dt>\u003cdd>\u003ca href=\"/documenti/\">Iscrizioni, DURC e polizze\u003c/a>\u003c/dd>\u003c/div>\u003c/dl>\u003cp>\u003ca class=\"btn ghost\" href=\"https://www.google.com/maps/search/?api=1&query=Via+Cascina+Nuova+1+20084+Lacchiarella+MI\" target=\"_blank\" rel=\"noopener\">Apri in Google Maps\u003c/a>\u003c/p>\u003c/div>\n  \u003c/div>\u003c/section>\u003c/main>\n\u003cmain data-path=\"/documenti/\" data-titolo=\"Documenti | Messina Autotrasporti\" hidden>\u003cdiv class=\"ph\">\u003cdiv class=\"wrap\">\n    \u003cnav class=\"briciole\" aria-label=\"Sei qui\">\u003ca href=\"/\">Home\u003c/a> \u003cspan aria-hidden=\"true\">/\u003c/span> \u003ca href=\"/azienda/\">Azienda\u003c/a> \u003cspan aria-hidden=\"true\">/\u003c/span> \u003cspan>Documenti\u003c/span>\u003c/nav>\n    \u003ch1>Documenti\u003c/h1>\n    \u003cp class=\"lead\">Quello che serve al vostro ufficio acquisti per qualificarci come fornitore. Ve lo mandiamo su richiesta, sempre aggiornato.\u003c/p>\n  \u003c/div>\u003c/div>\u003csection>\u003cdiv class=\"wrap\">\n    \n    \u003cdl class=\"dati\">\u003cdiv>\u003cdt>Albo degli autotrasportatori\u003c/dt>\u003cdd>Iscrizione all'Albo nazionale delle persone fisiche e giuridiche che esercitano l'autotrasporto di cose per conto di terzi [numero da inserire]\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Albo gestori ambientali\u003c/dt>\u003cdd>Iscrizione n. MI/062921 per il trasporto di rifiuti non pericolosi\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Regolarità\u003c/dt>\u003cdd>Il committente può verificare la nostra regolarità contributiva e fiscale online sul Portale dell'automobilista, come previsto per l'autotrasporto conto terzi: così è sollevato dalla responsabilità solidale\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Assicurazione\u003c/dt>\u003cdd>Polizza di responsabilità civile del vettore [compagnia e massimale da inserire]; assicurazione aggiuntiva della merce su richiesta\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Visura e certificati\u003c/dt>\u003cdd>Visura camerale, DURC e certificato di iscrizione all'Albo, inviati su richiesta\u003c/dd>\u003c/div>\u003c/dl>\u003cp style=\"margin-top:22px\">\u003ca class=\"btn\" href=\"/contatti/#modulo\">Chiedi i documenti\u003c/a>\u003c/p>\n  \u003c/div>\u003c/section>\u003c/main>\n\u003cmain data-path=\"/lavora-con-noi/\" data-titolo=\"Lavora con noi | Messina Autotrasporti\" hidden>\u003cdiv class=\"ph\">\u003cdiv class=\"wrap\">\n    \u003cnav class=\"briciole\" aria-label=\"Sei qui\">\u003ca href=\"/\">Home\u003c/a> \u003cspan aria-hidden=\"true\">/\u003c/span> \u003cspan>Lavora con noi\u003c/span>\u003c/nav>\n    \u003ch1>Lavora con noi\u003c/h1>\n    \u003cp class=\"lead\">Cerchiamo persone affidabili che vogliono lavorare in una squadra seria, con mezzi in ordine e strumenti nuovi.\u003c/p>\n  \u003c/div>\u003c/div>\u003csection>\u003cdiv class=\"wrap\">\n    \u003cdiv class=\"sh\">\u003ch2>Chi cerchiamo.\u003c/h2>\u003cspan>\u003c/span>\u003c/div>\n    \u003cdiv class=\"servizi glass\">\n  \u003cdiv class=\"srv\">\n    \u003ch3>Autisti\u003c/h3>\n    \u003cdiv>\u003cp>Distribuzione nel Nord Italia con rientro in giornata. Servono patente C o CE e carta di qualificazione del conducente (CQC merci).\u003c/p>\u003c/div>\n    \u003cspan class=\"tag\">Patente C o CE\u003c/span>\n  \u003c/div>\n  \u003cdiv class=\"srv\">\n    \u003ch3>Magazzinieri\u003c/h3>\n    \u003cdiv>\u003cp>Ricevimento, preparazione e carico con lo scanner. Turni tra le 6 del mattino e la sera.\u003c/p>\u003c/div>\n    \u003cspan class=\"tag\">Lacchiarella\u003c/span>\n  \u003c/div>\n  \u003cdiv class=\"srv\">\n    \u003ch3>Mulettisti\u003c/h3>\n    \u003cdiv>\u003cp>Movimentazione bancali a scaffale. Serve l'abilitazione all'uso del carrello elevatore.\u003c/p>\u003c/div>\n    \u003cspan class=\"tag\">Patentino\u003c/span>\n  \u003c/div>\n  \u003cdiv class=\"srv\">\n    \u003ch3>Ufficio\u003c/h3>\n    \u003cdiv>\u003cp>Gestione ordini, bolle e giri insieme al nostro ufficio traffico.\u003c/p>\u003c/div>\n    \u003cspan class=\"tag\">Bolle e traffico\u003c/span>\n  \u003c/div>\u003c/div>\n  \u003c/div>\u003c/section>\u003csection style=\"padding-top:0\">\u003cdiv class=\"wrap\">\n    \u003cdiv class=\"sh\">\u003ch2>Cosa trovate da noi.\u003c/h2>\u003cspan>\u003c/span>\u003c/div>\n    \u003col class=\"passi glass\">\u003cli>\u003cb>Un mezzo vostro\u003c/b>\u003cspan>Assegnato alla persona, curato dal meccanico interno.\u003c/span>\u003c/li>\u003cli>\u003cb>App semplice\u003c/b>\u003cspan>Consegne, firme e foto dal telefono, senza carta.\u003c/span>\u003c/li>\u003cli>\u003cb>Rientro a casa\u003c/b>\u003cspan>Il giro si chiude dall'app, niente ore in ufficio a fine giornata.\u003c/span>\u003c/li>\u003cli>\u003cb>Crescita\u003c/b>\u003cspan>Formazione e possibilità di cambiare ruolo.\u003c/span>\u003c/li>\u003c/ol>\n  \u003c/div>\u003c/section>\u003csection id=\"modulo\" style=\"padding-top:0\">\u003cdiv class=\"wrap prev\">\u003cdiv>\u003ch2>Candidatevi.\u003c/h2>\u003cp class=\"lead\">Lasciate i vostri dati: vi chiamiamo noi. Il curriculum potete mandarlo a \u003ca href=\"mailto:lavoro@messina-autotrasporti.it\">lavoro@messina-autotrasporti.it\u003c/a>.\u003c/p>\u003c/div>\n    \u003cform class=\"form panel glass\" data-sito=\"trasporti\" data-tipo=\"candidatura\" data-ok=\"Richiesta inviata. Vi rispondiamo all'indirizzo email che avete indicato.\" novalidate>\n    \u003clabel class=\"f\">Nome e cognome\u003cinput name=\"nome\" autocomplete=\"name\" required maxlength=\"80\">\u003c/label>\u003clabel class=\"f\">Azienda\u003cinput name=\"azienda\" autocomplete=\"organization\" maxlength=\"120\">\u003c/label>\u003clabel class=\"f\">Email\u003cinput name=\"email\" type=\"email\" autocomplete=\"email\" required maxlength=\"200\">\u003c/label>\u003clabel class=\"f\">Telefono\u003cinput name=\"telefono\" type=\"tel\" autocomplete=\"tel\" maxlength=\"40\">\u003c/label>\n    \u003clabel class=\"f w\">Posizione\u003cselect data-dettaglio=\"Posizione\">\u003coption value=\"\">Scegli\u003c/option>\u003coption>Autista\u003c/option>\u003coption>Magazziniere\u003c/option>\u003coption>Mulettista\u003c/option>\u003coption>Ufficio\u003c/option>\u003coption>Altro\u003c/option>\u003c/select>\u003c/label>\u003cfieldset class=\"f w gruppo\">\u003clegend>Patenti e abilitazioni\u003c/legend>\u003cdiv class=\"chips\">\u003clabel>\u003cinput type=\"checkbox\" value=\"B\" data-dettaglio=\"Patenti\">\u003cspan>B\u003c/span>\u003c/label>\u003clabel>\u003cinput type=\"checkbox\" value=\"C\" data-dettaglio=\"Patenti\">\u003cspan>C\u003c/span>\u003c/label>\u003clabel>\u003cinput type=\"checkbox\" value=\"CE\" data-dettaglio=\"Patenti\">\u003cspan>CE\u003c/span>\u003c/label>\u003clabel>\u003cinput type=\"checkbox\" value=\"CQC merci\" data-dettaglio=\"Patenti\">\u003cspan>CQC merci\u003c/span>\u003c/label>\u003clabel>\u003cinput type=\"checkbox\" value=\"Muletto\" data-dettaglio=\"Patenti\">\u003cspan>Muletto\u003c/span>\u003c/label>\u003c/div>\u003c/fieldset>\u003clabel class=\"f w\">Dove abitate\u003cinput data-dettaglio=\"Zona\" placeholder=\"Comune\" maxlength=\"120\">\u003c/label>\n    \u003clabel class=\"f w\">Note\u003ctextarea name=\"note\" maxlength=\"3000\" placeholder=\"Esperienze precedenti, disponibilità, quando potete iniziare\">\u003c/textarea>\u003c/label>\n    \u003clabel class=\"hp\" aria-hidden=\"true\">Sito web\u003cinput name=\"sito_web\" tabindex=\"-1\" autocomplete=\"off\">\u003c/label>\n    \u003clabel class=\"priv\">\u003cinput type=\"checkbox\" name=\"privacy\" required>\u003cspan>Ho letto l'\u003ca href=\"/privacy/\">informativa privacy\u003c/a>. Usiamo questi dati solo per rispondere alla richiesta.\u003c/span>\u003c/label>\n    \u003cdiv class=\"w\">\u003cbutton class=\"btn\" type=\"submit\">Invia la candidatura\u003c/button>\u003c/div>\n    \u003cdiv class=\"esito\" role=\"status\" tabindex=\"-1\" hidden>\u003c/div>\n  \u003c/form>\n  \u003c/div>\u003c/section>\u003c/main>\n\u003cmain data-path=\"/traccia/\" data-titolo=\"Traccia una spedizione | Messina Autotrasporti\" hidden>\u003cdiv class=\"ph\">\u003cdiv class=\"wrap\">\n    \u003cnav class=\"briciole\" aria-label=\"Sei qui\">\u003ca href=\"/\">Home\u003c/a> \u003cspan aria-hidden=\"true\">/\u003c/span> \u003cspan>Traccia\u003c/span>\u003c/nav>\n    \u003ch1>Traccia una spedizione\u003c/h1>\n    \u003cp class=\"lead\">Inserite il numero della bolla che trovate sul documento di trasporto o nella mail di conferma.\u003c/p>\n  \u003c/div>\u003c/div>\u003csection style=\"padding-top:0\">\u003cdiv class=\"wrap traccia\">\n    \u003cform class=\"cerca-sped panel glass\" data-traccia novalidate>\n      \u003clabel class=\"f\">Numero della bolla\u003cinput name=\"numero\" required maxlength=\"30\" placeholder=\"Per esempio 26-000043\" autocomplete=\"off\">\u003c/label>\n      \u003clabel class=\"f\">CAP di consegna\u003cinput name=\"cap\" inputmode=\"numeric\" maxlength=\"5\" placeholder=\"20100\">\u003c/label>\n      \u003cbutton class=\"btn\" type=\"submit\">Traccia\u003c/button>\n      \u003cdiv class=\"traccia-esito\" role=\"status\" tabindex=\"-1\" hidden>\u003c/div>\n    \u003c/form>\n    \u003cdiv>\u003ch2 class=\"h3\">Avete molte spedizioni?\u003c/h2>\u003cp class=\"muted\" style=\"margin-top:8px\">Nell'area clienti le vedete tutte insieme, con la prova di consegna di ognuna.\u003c/p>\u003cp style=\"margin-top:16px\">\u003ca class=\"btn ghost\" href=\"#\" data-link=\"portaleUrl\">Area clienti\u003c/a>\u003c/p>\u003c/div>\n  \u003c/div>\u003c/section>\u003c/main>\n\u003cmain data-path=\"/preventivo/\" data-titolo=\"Chiedi un preventivo | Messina Autotrasporti\" hidden>\u003cdiv class=\"ph\">\u003cdiv class=\"wrap\">\n    \u003cnav class=\"briciole\" aria-label=\"Sei qui\">\u003ca href=\"/\">Home\u003c/a> \u003cspan aria-hidden=\"true\">/\u003c/span> \u003cspan>Preventivo\u003c/span>\u003c/nav>\n    \u003ch1>Chiedi un preventivo\u003c/h1>\n    \u003cp class=\"lead\">Diteci cosa spedite, da dove a dove e ogni quanto. La richiesta arriva direttamente al nostro commerciale.\u003c/p>\n  \u003c/div>\u003c/div>\u003csection id=\"modulo\" style=\"padding-top:0\">\u003cdiv class=\"wrap prev\">\u003cdiv>\u003cdiv class=\"contatti\">\u003cdiv>\u003cb>Sede e magazzino\u003c/b>Via Cascina Nuova 1, 20084 Lacchiarella (MI)\u003cbr>\u003ca href=\"https://www.google.com/maps/search/?api=1&query=Via+Cascina+Nuova+1+20084+Lacchiarella+MI\" target=\"_blank\" rel=\"noopener\">Apri in Google Maps\u003c/a>\u003c/div>\u003cdiv>\u003cb>Telefono\u003c/b>\u003ca href=\"tel:+390292270155\">02 9227 0155\u003c/a>\u003c/div>\u003cdiv>\u003cb>Email\u003c/b>\u003ca href=\"mailto:info@messina-autotrasporti.it\">info@messina-autotrasporti.it\u003c/a>\u003c/div>\u003c/div>\u003cp class=\"muted\" style=\"margin-top:24px;max-width:36ch\">Più dettagli ci date (quantità, misure, accessori), più il preventivo è preciso.\u003c/p>\u003c/div>\n    \u003cform class=\"form panel glass\" data-sito=\"trasporti\" data-tipo=\"preventivo\" data-ok=\"Richiesta inviata. Vi rispondiamo all'indirizzo email che avete indicato.\" novalidate>\n    \u003clabel class=\"f\">Nome e cognome\u003cinput name=\"nome\" autocomplete=\"name\" required maxlength=\"80\">\u003c/label>\u003clabel class=\"f\">Azienda\u003cinput name=\"azienda\" autocomplete=\"organization\" maxlength=\"120\">\u003c/label>\u003clabel class=\"f\">Email\u003cinput name=\"email\" type=\"email\" autocomplete=\"email\" required maxlength=\"200\">\u003c/label>\u003clabel class=\"f\">Telefono\u003cinput name=\"telefono\" type=\"tel\" autocomplete=\"tel\" maxlength=\"40\">\u003c/label>\n    \u003cfieldset class=\"f w gruppo\">\u003clegend>Cosa vi serve\u003c/legend>\u003cdiv class=\"chips\">\u003clabel>\u003cinput type=\"checkbox\" value=\"Trasporto bancali\" data-dettaglio=\"Servizio\">\u003cspan>Trasporto bancali\u003c/span>\u003c/label>\u003clabel>\u003cinput type=\"checkbox\" value=\"Trasporto colli\" data-dettaglio=\"Servizio\">\u003cspan>Trasporto colli\u003c/span>\u003c/label>\u003clabel>\u003cinput type=\"checkbox\" value=\"Magazzino\" data-dettaglio=\"Servizio\">\u003cspan>Magazzino\u003c/span>\u003c/label>\u003clabel>\u003cinput type=\"checkbox\" value=\"Logistica IT\" data-dettaglio=\"Servizio\">\u003cspan>Logistica IT\u003c/span>\u003c/label>\u003clabel>\u003cinput type=\"checkbox\" value=\"Consegne a domicilio\" data-dettaglio=\"Servizio\">\u003cspan>Consegne a domicilio\u003c/span>\u003c/label>\u003c/div>\u003c/fieldset>\u003clabel class=\"f\">Da\u003cinput data-dettaglio=\"Da\" placeholder=\"Città di ritiro\" maxlength=\"120\">\u003c/label>\u003clabel class=\"f\">A\u003cinput data-dettaglio=\"A\" placeholder=\"Città di consegna\" maxlength=\"120\">\u003c/label>\u003clabel class=\"f\">Ogni quanto\u003cselect data-dettaglio=\"Frequenza\">\u003coption value=\"\">Scegli\u003c/option>\u003coption>Una volta\u003c/option>\u003coption>Ogni settimana\u003c/option>\u003coption>Ogni giorno\u003c/option>\u003coption>Da definire\u003c/option>\u003c/select>\u003c/label>\u003clabel class=\"f\">Quantità indicativa\u003cinput data-dettaglio=\"Quantità\" placeholder=\"Per esempio 6 bancali\" maxlength=\"120\">\u003c/label>\u003cfieldset class=\"f w gruppo\">\u003clegend>Servizi accessori\u003c/legend>\u003cdiv class=\"chips\">\u003clabel>\u003cinput type=\"checkbox\" value=\"Sponda\" data-dettaglio=\"Accessori\">\u003cspan>Sponda\u003c/span>\u003c/label>\u003clabel>\u003cinput type=\"checkbox\" value=\"Al piano\" data-dettaglio=\"Accessori\">\u003cspan>Al piano\u003c/span>\u003c/label>\u003clabel>\u003cinput type=\"checkbox\" value=\"Fascia oraria\" data-dettaglio=\"Accessori\">\u003cspan>Fascia oraria\u003c/span>\u003c/label>\u003clabel>\u003cinput type=\"checkbox\" value=\"Sabato\" data-dettaglio=\"Accessori\">\u003cspan>Sabato\u003c/span>\u003c/label>\u003clabel>\u003cinput type=\"checkbox\" value=\"Assicurazione\" data-dettaglio=\"Accessori\">\u003cspan>Assicurazione\u003c/span>\u003c/label>\u003c/div>\u003c/fieldset>\n    \u003clabel class=\"f w\">Note\u003ctextarea name=\"note\" maxlength=\"3000\" placeholder=\"Misure, pesi, date, tipo di merce\">\u003c/textarea>\u003c/label>\n    \u003clabel class=\"hp\" aria-hidden=\"true\">Sito web\u003cinput name=\"sito_web\" tabindex=\"-1\" autocomplete=\"off\">\u003c/label>\n    \u003clabel class=\"priv\">\u003cinput type=\"checkbox\" name=\"privacy\" required>\u003cspan>Ho letto l'\u003ca href=\"/privacy/\">informativa privacy\u003c/a>. Usiamo questi dati solo per rispondere alla richiesta.\u003c/span>\u003c/label>\n    \u003cdiv class=\"w\">\u003cbutton class=\"btn\" type=\"submit\">Chiedi un preventivo\u003c/button>\u003c/div>\n    \u003cdiv class=\"esito\" role=\"status\" tabindex=\"-1\" hidden>\u003c/div>\n  \u003c/form>\n  \u003c/div>\u003c/section>\u003c/main>\n\u003cmain data-path=\"/ritiro/\" data-titolo=\"Prenota un ritiro | Messina Autotrasporti\" hidden>\u003cdiv class=\"ph\">\u003cdiv class=\"wrap\">\n    \u003cnav class=\"briciole\" aria-label=\"Sei qui\">\u003ca href=\"/\">Home\u003c/a> \u003cspan aria-hidden=\"true\">/\u003c/span> \u003cspan>Ritiro\u003c/span>\u003c/nav>\n    \u003ch1>Prenota un ritiro\u003c/h1>\n    \u003cp class=\"lead\">Per i clienti già attivi. Vi confermiamo per mail giorno e fascia oraria del ritiro.\u003c/p>\n  \u003c/div>\u003c/div>\u003csection id=\"modulo\" style=\"padding-top:0\">\u003cdiv class=\"wrap prev\">\u003cdiv>\u003cdiv class=\"contatti\">\u003cdiv>\u003cb>Ordini e ritiri\u003c/b>\u003ca href=\"mailto:ordini@messina-autotrasporti.it\">ordini@messina-autotrasporti.it\u003c/a>\u003c/div>\u003cdiv>\u003cb>Telefono\u003c/b>\u003ca href=\"tel:+390292270155\">02 9227 0155\u003c/a>\u003c/div>\u003c/div>\u003cp class=\"muted\" style=\"margin-top:24px;max-width:36ch\">Non siete ancora clienti? \u003ca href=\"/preventivo/\">Chiedete prima un preventivo\u003c/a>.\u003c/p>\u003c/div>\n    \u003cform class=\"form panel glass\" data-sito=\"trasporti\" data-tipo=\"ritiro\" data-ok=\"Richiesta inviata. Vi rispondiamo all'indirizzo email che avete indicato.\" novalidate>\n    \u003clabel class=\"f\">Nome e cognome\u003cinput name=\"nome\" autocomplete=\"name\" required maxlength=\"80\">\u003c/label>\u003clabel class=\"f\">Azienda\u003cinput name=\"azienda\" autocomplete=\"organization\" maxlength=\"120\">\u003c/label>\u003clabel class=\"f\">Email\u003cinput name=\"email\" type=\"email\" autocomplete=\"email\" required maxlength=\"200\">\u003c/label>\u003clabel class=\"f\">Telefono\u003cinput name=\"telefono\" type=\"tel\" autocomplete=\"tel\" maxlength=\"40\">\u003c/label>\n    \u003clabel class=\"f w\">Indirizzo di ritiro\u003cinput data-dettaglio=\"Indirizzo\" required maxlength=\"160\" placeholder=\"Via, numero, città\">\u003c/label>\u003clabel class=\"f\">Giorno preferito\u003cinput data-dettaglio=\"Data\" type=\"date\">\u003c/label>\u003clabel class=\"f\">Colli o bancali\u003cinput data-dettaglio=\"Colli\" placeholder=\"Per esempio 4 bancali\" maxlength=\"80\">\u003c/label>\u003clabel class=\"f w\">Destinazione\u003cinput data-dettaglio=\"Destinazione\" placeholder=\"Città o magazzino Lacchiarella\" maxlength=\"120\">\u003c/label>\u003cfieldset class=\"f w gruppo\">\u003clegend>Serve\u003c/legend>\u003cdiv class=\"chips\">\u003clabel>\u003cinput type=\"checkbox\" value=\"Sponda\" data-dettaglio=\"Accessori\">\u003cspan>Sponda\u003c/span>\u003c/label>\u003clabel>\u003cinput type=\"checkbox\" value=\"Transpallet\" data-dettaglio=\"Accessori\">\u003cspan>Transpallet\u003c/span>\u003c/label>\u003clabel>\u003cinput type=\"checkbox\" value=\"Orario preciso\" data-dettaglio=\"Accessori\">\u003cspan>Orario preciso\u003c/span>\u003c/label>\u003c/div>\u003c/fieldset>\n    \u003clabel class=\"f w\">Note\u003ctextarea name=\"note\" maxlength=\"3000\" placeholder=\"Orari di apertura, persona di riferimento, peso indicativo\">\u003c/textarea>\u003c/label>\n    \u003clabel class=\"hp\" aria-hidden=\"true\">Sito web\u003cinput name=\"sito_web\" tabindex=\"-1\" autocomplete=\"off\">\u003c/label>\n    \u003clabel class=\"priv\">\u003cinput type=\"checkbox\" name=\"privacy\" required>\u003cspan>Ho letto l'\u003ca href=\"/privacy/\">informativa privacy\u003c/a>. Usiamo questi dati solo per rispondere alla richiesta.\u003c/span>\u003c/label>\n    \u003cdiv class=\"w\">\u003cbutton class=\"btn\" type=\"submit\">Prenota il ritiro\u003c/button>\u003c/div>\n    \u003cdiv class=\"esito\" role=\"status\" tabindex=\"-1\" hidden>\u003c/div>\n  \u003c/form>\n  \u003c/div>\u003c/section>\u003c/main>\n\u003cmain data-path=\"/contatti/\" data-titolo=\"Contatti | Messina Autotrasporti\" hidden>\u003cdiv class=\"ph\">\u003cdiv class=\"wrap\">\n    \u003cnav class=\"briciole\" aria-label=\"Sei qui\">\u003ca href=\"/\">Home\u003c/a> \u003cspan aria-hidden=\"true\">/\u003c/span> \u003cspan>Contatti\u003c/span>\u003c/nav>\n    \u003ch1>Contatti\u003c/h1>\n    \u003cp class=\"lead\">Scriveteci all'ufficio giusto: vi risponde chi segue davvero la vostra richiesta.\u003c/p>\n  \u003c/div>\u003c/div>\u003csection>\u003cdiv class=\"wrap\">\n    \n    \u003cdiv class=\"uffici\">\u003cdiv class=\"glass\">\u003cb>Informazioni\u003c/b>\u003ca href=\"mailto:info@messina-autotrasporti.it\">info@messina-autotrasporti.it\u003c/a>\u003cspan class=\"muted\">Domande generali e nuovi clienti\u003c/span>\u003c/div>\u003cdiv class=\"glass\">\u003cb>Ordini e ritiri\u003c/b>\u003ca href=\"mailto:ordini@messina-autotrasporti.it\">ordini@messina-autotrasporti.it\u003c/a>\u003cspan class=\"muted\">Bolle, ritiri, consegne del giorno\u003c/span>\u003c/div>\u003cdiv class=\"glass\">\u003cb>Commerciale\u003c/b>\u003ca href=\"mailto:commerciale@messina-autotrasporti.it\">commerciale@messina-autotrasporti.it\u003c/a>\u003cspan class=\"muted\">Preventivi e tariffe\u003c/span>\u003c/div>\u003cdiv class=\"glass\">\u003cb>Amministrazione\u003c/b>\u003ca href=\"mailto:amministrazione@messina-autotrasporti.it\">amministrazione@messina-autotrasporti.it\u003c/a>\u003cspan class=\"muted\">Fatture e pagamenti\u003c/span>\u003c/div>\u003cdiv class=\"glass\">\u003cb>Lavoro\u003c/b>\u003ca href=\"mailto:lavoro@messina-autotrasporti.it\">lavoro@messina-autotrasporti.it\u003c/a>\u003cspan class=\"muted\">Candidature e curriculum\u003c/span>\u003c/div>\u003cdiv class=\"glass\">\u003cb>Telefono\u003c/b>\u003ca href=\"tel:+390292270155\">02 9227 0155\u003c/a>\u003cspan class=\"muted\">Dal lunedì al venerdì, [orari uffici]\u003c/span>\u003c/div>\u003c/div>\n  \u003c/div>\u003c/section>\u003csection id=\"modulo\" style=\"padding-top:0\">\u003cdiv class=\"wrap prev\">\u003cdiv>\u003ch2>Scriveteci.\u003c/h2>\u003cdiv class=\"contatti\">\u003cdiv>\u003cb>Sede e magazzino\u003c/b>Via Cascina Nuova 1, 20084 Lacchiarella (MI)\u003cbr>\u003ca href=\"https://www.google.com/maps/search/?api=1&query=Via+Cascina+Nuova+1+20084+Lacchiarella+MI\" target=\"_blank\" rel=\"noopener\">Apri in Google Maps\u003c/a>\u003c/div>\u003cdiv>\u003cb>Telefono\u003c/b>\u003ca href=\"tel:+390292270155\">02 9227 0155\u003c/a>\u003c/div>\u003cdiv>\u003cb>Email\u003c/b>\u003ca href=\"mailto:info@messina-autotrasporti.it\">info@messina-autotrasporti.it\u003c/a>\u003c/div>\u003c/div>\u003c/div>\u003cform class=\"form panel glass\" data-sito=\"trasporti\" data-tipo=\"contatto\" data-ok=\"Richiesta inviata. Vi rispondiamo all'indirizzo email che avete indicato.\" novalidate>\n    \u003clabel class=\"f\">Nome e cognome\u003cinput name=\"nome\" autocomplete=\"name\" required maxlength=\"80\">\u003c/label>\u003clabel class=\"f\">Azienda\u003cinput name=\"azienda\" autocomplete=\"organization\" maxlength=\"120\">\u003c/label>\u003clabel class=\"f\">Email\u003cinput name=\"email\" type=\"email\" autocomplete=\"email\" required maxlength=\"200\">\u003c/label>\u003clabel class=\"f\">Telefono\u003cinput name=\"telefono\" type=\"tel\" autocomplete=\"tel\" maxlength=\"40\">\u003c/label>\n    \u003clabel class=\"f w\">Argomento\u003cselect data-dettaglio=\"Argomento\">\u003coption value=\"\">Scegli\u003c/option>\u003coption>Informazioni\u003c/option>\u003coption>Documenti\u003c/option>\u003coption>Reclamo\u003c/option>\u003coption>Fornitori\u003c/option>\u003coption>Altro\u003c/option>\u003c/select>\u003c/label>\n    \u003clabel class=\"f w\">Note\u003ctextarea name=\"note\" maxlength=\"3000\" placeholder=\"Scrivete qui la vostra richiesta\">\u003c/textarea>\u003c/label>\n    \u003clabel class=\"hp\" aria-hidden=\"true\">Sito web\u003cinput name=\"sito_web\" tabindex=\"-1\" autocomplete=\"off\">\u003c/label>\n    \u003clabel class=\"priv\">\u003cinput type=\"checkbox\" name=\"privacy\" required>\u003cspan>Ho letto l'\u003ca href=\"/privacy/\">informativa privacy\u003c/a>. Usiamo questi dati solo per rispondere alla richiesta.\u003c/span>\u003c/label>\n    \u003cdiv class=\"w\">\u003cbutton class=\"btn\" type=\"submit\">Invia il messaggio\u003c/button>\u003c/div>\n    \u003cdiv class=\"esito\" role=\"status\" tabindex=\"-1\" hidden>\u003c/div>\n  \u003c/form>\u003c/div>\u003c/section>\u003c/main>\n\u003cmain data-path=\"/domande/\" data-titolo=\"Domande frequenti | Messina Autotrasporti\" hidden>\u003cdiv class=\"ph\">\u003cdiv class=\"wrap\">\n    \u003cnav class=\"briciole\" aria-label=\"Sei qui\">\u003ca href=\"/\">Home\u003c/a> \u003cspan aria-hidden=\"true\">/\u003c/span> \u003cspan>Domande\u003c/span>\u003c/nav>\n    \u003ch1>Domande frequenti\u003c/h1>\n    \u003cp class=\"lead\">Le risposte che chiedete più spesso al nostro ufficio.\u003c/p>\n  \u003c/div>\u003c/div>\u003csection>\u003cdiv class=\"wrap\">\n    \u003cdiv class=\"sh\">\u003ch2>Spedizioni\u003c/h2>\u003cspan>\u003c/span>\u003c/div>\n    \u003cdiv class=\"faq glass\">\u003cdetails>\u003csummary>Come chiedo un preventivo?\u003c/summary>\u003cdiv>Dalla pagina \u003ca href=\"/preventivo/\">Preventivo\u003c/a> o scrivendo a \u003ca href=\"mailto:commerciale@messina-autotrasporti.it\">commerciale@messina-autotrasporti.it\u003c/a>. Vi risponde il nostro commerciale.\u003c/div>\u003c/details>\u003cdetails>\u003csummary>Come mando un ordine?\u003c/summary>\u003cdiv>Per mail a ordini, con indirizzo, colli e accessori. Gli accordi presi al telefono ve li confermiamo sempre per mail, così tutto resta scritto.\u003c/div>\u003c/details>\u003cdetails>\u003csummary>Posso sapere dov'è la mia spedizione?\u003c/summary>\u003cdiv>Sì, con il numero della bolla nella pagina \u003ca href=\"/traccia/\">Traccia\u003c/a> o dall'area clienti.\u003c/div>\u003c/details>\u003cdetails>\u003csummary>Consegnate di sabato o di sera?\u003c/summary>\u003cdiv>Il sabato mattina sì, su richiesta. Le consegne serali le valutiamo caso per caso.\u003c/div>\u003c/details>\u003c/div>\n  \u003c/div>\u003c/section>\u003csection style=\"padding-top:0\">\u003cdiv class=\"wrap\">\n    \u003cdiv class=\"sh\">\u003ch2>Problemi\u003c/h2>\u003cspan>\u003c/span>\u003c/div>\n    \u003cdiv class=\"faq glass\">\u003cdetails>\u003csummary>Cosa succede se il destinatario non c'è?\u003c/summary>\u003cdiv>La merce va in giacenza nel nostro magazzino e vi avvisiamo il giorno stesso. Vedete la pagina \u003ca href=\"/servizi/giacenze-resi/\">Giacenze e resi\u003c/a>.\u003c/div>\u003c/details>\u003cdetails>\u003csummary>Come segnalo un danno?\u003c/summary>\u003cdiv>Se il danno si vede alla consegna, scrivetelo sul documento dell'autista prima di firmare. Se scoprite un danno non visibile all'apertura dell'imballo, segnalatelo per iscritto entro 8 giorni dal ricevimento, come prevede il codice civile, con foto della merce e dell'imballo.\u003c/div>\u003c/details>\u003cdetails>\u003csummary>La merce è assicurata?\u003c/summary>\u003cdiv>Per legge, nei trasporti nazionali il vettore risponde fino a 1 euro per chilogrammo di peso lordo della merce persa o danneggiata (art. 1696 del codice civile). Per merce di valore potete chiederci un'assicurazione aggiuntiva sul valore dichiarato.\u003c/div>\u003c/details>\u003c/div>\n  \u003c/div>\u003c/section>\u003csection style=\"padding-top:0\">\u003cdiv class=\"wrap\">\n    \u003cdiv class=\"sh\">\u003ch2>Fatture e documenti\u003c/h2>\u003cspan>\u003c/span>\u003c/div>\n    \u003cdiv class=\"faq glass\">\u003cdetails>\u003csummary>Come ricevo le fatture?\u003c/summary>\u003cdiv>Elettroniche tramite SdI, con il dettaglio di ogni consegna e degli accessori. Nell'area clienti trovate anche il PDF.\u003c/div>\u003c/details>\u003cdetails>\u003csummary>Mi servono DURC e iscrizioni per qualificarvi come fornitore.\u003c/summary>\u003cdiv>Trovate l'elenco nella pagina \u003ca href=\"/documenti/\">Documenti\u003c/a>: ve li mandiamo su richiesta.\u003c/div>\u003c/details>\u003c/div>\n  \u003c/div>\u003c/section>\u003c/main>\n\u003cmain data-path=\"/condizioni/\" data-titolo=\"Condizioni di trasporto | Messina Autotrasporti\" hidden>\u003cdiv class=\"ph\">\u003cdiv class=\"wrap\">\n    \u003cnav class=\"briciole\" aria-label=\"Sei qui\">\u003ca href=\"/\">Home\u003c/a> \u003cspan aria-hidden=\"true\">/\u003c/span> \u003cspan>Condizioni di trasporto\u003c/span>\u003c/nav>\n    \u003ch1>Condizioni di trasporto\u003c/h1>\n    \n  \u003c/div>\u003c/div>\u003csection style=\"padding-top:0\">\u003cdiv class=\"wrap prosa\">\u003cp class=\"bozza\">Testo indicativo da far verificare prima della pubblicazione.\u003c/p>\n  \u003ch2>Oggetto\u003c/h2>\u003cp>Queste condizioni valgono per i trasporti di merci su strada per conto terzi affidati a Messina Autotrasporti S.r.l., salvo quanto diversamente previsto nel contratto con il singolo cliente.\u003c/p>\n  \u003ch2>Ordini\u003c/h2>\u003cp>Gli ordini si inviano per iscritto, anche per mail, con indirizzo, numero di colli, peso indicativo, accessori richiesti ed eventuali vincoli di orario. Gli accordi telefonici sono confermati per mail.\u003c/p>\n  \u003ch2>Responsabilità\u003c/h2>\u003cp>Nei trasporti nazionali la responsabilità del vettore per perdita o avaria è limitata a 1 euro per chilogrammo di peso lordo (art. 1696 c.c.); nei trasporti internazionali si applica la Convenzione CMR. Su richiesta scritta è possibile assicurare la merce per il valore dichiarato.\u003c/p>\n  \u003ch2>Reclami\u003c/h2>\u003cp>Le riserve per danni visibili vanno scritte sul documento di trasporto alla consegna. I danni non riconoscibili al momento della consegna vanno segnalati per iscritto entro 8 giorni dal ricevimento (art. 1698 c.c.).\u003c/p>\n  \u003ch2>Giacenze\u003c/h2>\u003cp>In caso di mancata consegna non imputabile al vettore, la merce resta in giacenza a Lacchiarella con i costi di deposito e riconsegna previsti dal contratto.\u003c/p>\n  \u003ch2>Merci escluse\u003c/h2>\u003cp>Non trasportiamo merci pericolose soggette ad ADR, denaro e valori, animali vivi [elenco da confermare].\u003c/p>\u003c/div>\u003c/section>\u003c/main>\n\u003cmain data-path=\"/privacy/\" data-titolo=\"Privacy | Messina Autotrasporti\" hidden>\u003cdiv class=\"ph\">\u003cdiv class=\"wrap\">\n    \u003cnav class=\"briciole\" aria-label=\"Sei qui\">\u003ca href=\"/\">Home\u003c/a> \u003cspan aria-hidden=\"true\">/\u003c/span> \u003cspan>Privacy\u003c/span>\u003c/nav>\n    \u003ch1>Privacy\u003c/h1>\n    \n  \u003c/div>\u003c/div>\u003csection style=\"padding-top:0\">\u003cdiv class=\"wrap prosa\">\u003cp class=\"bozza\">Testo indicativo da far verificare prima della pubblicazione.\u003c/p>\n  \u003ch2>Titolare\u003c/h2>\u003cp>Messina Autotrasporti S.r.l., Via Cascina Nuova 1, 20084 Lacchiarella (MI), P.IVA 09420230964, \u003ca href=\"mailto:info@messina-autotrasporti.it\">info@messina-autotrasporti.it\u003c/a>.\u003c/p>\n  \u003ch2>Quali dati e perché\u003c/h2>\u003cp>I dati che scrivete nei moduli (nome, azienda, email, telefono e i dettagli della richiesta) servono solo a rispondervi e a preparare un'offerta o organizzare un ritiro. Base giuridica: misure precontrattuali richieste da voi (art. 6.1.b GDPR). Per le candidature: la valutazione del profilo per un'eventuale assunzione.\u003c/p>\n  \u003ch2>Per quanto tempo\u003c/h2>\u003cp>Fino a 24 mesi dall'ultima comunicazione; le candidature per 12 mesi. Se la richiesta diventa un contratto, per i tempi previsti dalla legge.\u003c/p>\n  \u003ch2>Chi li vede\u003c/h2>\u003cp>Solo il personale incaricato. I dati sono conservati su server nell'Unione europea con fornitori che agiscono come responsabili del trattamento.\u003c/p>\n  \u003ch2>I vostri diritti\u003c/h2>\u003cp>Potete chiedere di vedere, correggere o cancellare i vostri dati, o opporvi al trattamento, scrivendo a \u003ca href=\"mailto:info@messina-autotrasporti.it\">info@messina-autotrasporti.it\u003c/a>. Potete rivolgervi al Garante per la protezione dei dati personali.\u003c/p>\u003c/div>\u003c/section>\u003c/main>\n\u003cmain data-path=\"/cookie/\" data-titolo=\"Cookie | Messina Autotrasporti\" hidden>\u003cdiv class=\"ph\">\u003cdiv class=\"wrap\">\n    \u003cnav class=\"briciole\" aria-label=\"Sei qui\">\u003ca href=\"/\">Home\u003c/a> \u003cspan aria-hidden=\"true\">/\u003c/span> \u003cspan>Cookie\u003c/span>\u003c/nav>\n    \u003ch1>Cookie\u003c/h1>\n    \n  \u003c/div>\u003c/div>\u003csection style=\"padding-top:0\">\u003cdiv class=\"wrap prosa\">\u003cp class=\"bozza\">Testo indicativo da far verificare prima della pubblicazione.\u003c/p>\u003cp>Questo sito non usa cookie di profilazione né strumenti di statistica di terze parti. Usa solo la memoria tecnica del browser necessaria al funzionamento delle pagine, che non richiede consenso.\u003c/p>\u003cp>Il carattere tipografico è caricato da Google Fonts [da sostituire con una copia ospitata sul sito].\u003c/p>\u003c/div>\u003c/section>\u003c/main>\n\u003cmain data-path=\"/note-legali/\" data-titolo=\"Note legali | Messina Autotrasporti\" hidden>\u003cdiv class=\"ph\">\u003cdiv class=\"wrap\">\n    \u003cnav class=\"briciole\" aria-label=\"Sei qui\">\u003ca href=\"/\">Home\u003c/a> \u003cspan aria-hidden=\"true\">/\u003c/span> \u003cspan>Note legali\u003c/span>\u003c/nav>\n    \u003ch1>Note legali\u003c/h1>\n    \n  \u003c/div>\u003c/div>\u003csection style=\"padding-top:0\">\u003cdiv class=\"wrap prosa\">\u003cp class=\"bozza\">Testo indicativo da far verificare prima della pubblicazione.\u003c/p>\u003cdl class=\"dati\">\u003cdiv>\u003cdt>Ragione sociale\u003c/dt>\u003cdd>Messina Autotrasporti S.r.l.\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Sede legale\u003c/dt>\u003cdd>Via Cascina Nuova 1, 20084 Lacchiarella (MI)\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Partita IVA\u003c/dt>\u003cdd>09420230964\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>REA\u003c/dt>\u003cdd>[da inserire]\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>PEC\u003c/dt>\u003cdd>[da inserire]\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Codice destinatario SdI\u003c/dt>\u003cdd>[da inserire]\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Albo gestori ambientali\u003c/dt>\u003cdd>n. MI/062921\u003c/dd>\u003c/div>\u003c/dl>\u003c/div>\u003c/section>\u003c/main>\n\u003cfooter>\n  \u003cdiv class=\"wrap\">\n    \u003cdiv class=\"g\">\n      \u003cdiv class=\"chi\">\u003cb>Messina Autotrasporti\u003c/b>\u003cs
